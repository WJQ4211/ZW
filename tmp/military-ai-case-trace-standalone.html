}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;military-ai-case-trace&quot;&gt;
  &lt;style&gt;
    #military-ai-case-trace { color: var(--foreground); }

a, Analytics, and Artificial Intelligence Adoption Strategy&quot;,&quot;claim&quot;:&quot;国防部各组成部门将集中某些AI开发平台，用于持续实验和部署，并最大化采用负责任的AI共享服务。&quot;,&quot;excerptZh&quot;:&quot;因此，国防部各组成部门将寻求集中某些AI开发平台，以进行持续实验和部署，然后最大限度地采用负责任的AI共享服务。&quot;,&quot;excerptOriginal&quot;:&quot;Thus, DoD Components will seek to centralize certain AI development platforms for continuous experimentation and deployment, and then maximize the adoption of responsible AI shared services.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-008&quot;,&quot;publisher&quot;:&quot;U.S. Department of Defense&quot;,&quot;publishedAt&quot;:&quot;2023-06-27&quot;,&quot;locator&quot;:&quot;pdf_page_14&quot;,&quot;sourceType&quot;:&quot;official_strategy&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;,&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;AI基础设施&quot;,&quot;共享服务&quot;,&quot;集中化&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/DOD_DATA_ANALYTICS_AI_ADOPTION_STRATEGY.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-01&quot;,&quot;relation&quot;:&quot;support&quot;},{&quot;id&quot;:&quot;HYP-T0-02&quot;,&quot;relation&quot;:&quot;counter&quot;}],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-STRAT-H02&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TECH-H02&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-ENG-H01&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-ENG-H02&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot; ber 2021.&quot;,&quot;nature&quot;:&quot;resource_input&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-001&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2022-01-13&quot;,&quot;locator&quot;:&quot;web_paragraph_0006&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;DARPA RACER&quot;,&quot;车队车辆交付&quot;,&quot;现场实验计划&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2022/racer-off-road-autonomy&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-2CF449726C937256&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Developing Algorithms that Make Decisions Aligned with Human Experts&quot;,&quot;claim&quot;:&quot;ITM计划采用包含人类和算法决策者的医疗分诊或大规模伤亡场景评估设计。&quot;,&quot;excerptZh&quot;:&quot;为了评估整个ITM流程，将向多个人类和算法决策者展示来自医疗分诊（第一阶段）或大规模伤亡（第二阶段）领域的场景。算法决策者将包括一个了解关键人类决策属性的对齐算法决策者，以及一个不了解这些关键人类属性的基线算法决策者。还将包括一名人类分诊专业人员作为实验对照。&quot;,&quot;excerptOriginal&quot;:&quot;To evaluate the whole ITM process, multiple human and algorithmic decision-makers will be presented scenarios from the medical triage (Phase 1) or mass casualty (Phase 2) domains. Algorithmic decision-makers will include an aligned algorithmic decision-maker with knowledge of key human decision-making attributes and a baseline algorithmic decision-maker with no knowledge of those key human attributes. A human triage professional will also be included as an experimental control.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-001&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2022-03-03&quot;,&quot;locator&quot;:&quot;web_paragraph_0010&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;human_machine_authority&quot;],&quot;topics&quot;:[&quot;ITM项目评估&quot;,&quot;测试设计&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2022/algorithms-human-experts&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-2D9AD11D628EFF58&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Should Improve Strategies, Inventory Process, and Collaboration Guidance&quot;,&quot;claim&quot;:&quot;JAIC官员表示，2021年4月的AI基线清单不包括与运维相关的AI活动（如JAIC整体运营预算）或任何机密AI活动。&quot;,&quot;excerptZh&quot;:&quot;JAIC官员表示，2021年4月的AI基线清单不包括与运维相关的AI活动（如JAIC的整体运营预算）或任何机密AI活动。&quot;,&quot;excerptOriginal&quot;:&quot;JAIC officials said the April 2021 AI baseline inventory does not include operations and maintenance-related AI activities—such the JAIC’s overall operating budget—or any classified AI activities.&quot;,&quot;nature&quot;:&quot;constraint&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_36&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;AI活动清单&quot;,&quot;局限性&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-2E42D28FCCBD88DD&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Needs Department-Wide Guidance to Inform Acquisitions&quot;,&quot;claim&quot;:&quot;在五个军种中，空军发布了针对人工智能的采办资源，即空军-麻省理工学院人工智能采办指南。&quot;,&quot;excerptZh&quot;:&quot;在五个军种中，空军发布了针对人工智能的采办资源——具体而言，即空军-麻省理工学院人工智能采办指南。&quot;,&quot;excerptOriginal&quot;:&quot;Of the five military services, the Air Force has published AI-specific acquisition resources—specifically, the Air Force-Massachusetts Institute of Technology AI Acquisition Guidebook.&quot;,&quot;nature&quot;:&quot;governance_event&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-PB-007&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2023-06-01&quot;,&quot;locator&quot;:&quot;pdf_page_29&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;空军&quot;,&quot;人工智能采办指南&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-23-105850.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-03&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-OPS-H03&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TRUST-H03&quot;,&quot;field&quot;:&quot;service_specific_guidance&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H03&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-2EEA5ADBB7CFF58C&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Responsible AI Strategy and Implementation Pathway&quot;,&quot;claim&quot;:&quot;国防部人工智能开发采用融合风险管理最佳实践的方法，以在坚持安全、可靠和伦理标准的同时利用尖端技术。&quot;,&quot;excerptZh&quot;:&quot;由于人工智能研究的持续进步和新兴人工智能战略的动态性，采用融合现有风险管理最佳实践的人工智能开发方法，使国防部能够在坚持安全、可靠和伦理标准的同时，灵活利用尖端技术。&quot;,&quot;excerptOriginal&quot;:&quot;Due to continuous advancements in Al research and the dynamic nature of emerging Al strategies, an approach to ATd evelopment that incorporates existing risk management best practices affords the DoD the flexibility to leverage cutting-edge technology while adhering to our standards for safety, reliability, and eth ics.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-007&quot;,&quot;publisher&quot;:&quot;U.S. Department of Defense&quot;,&quot;publishedAt&quot;:&quot;2022-06-01&quot;,&quot;locator&quot;:&quot;pdf_page_18&quot;,&quot;sourceType&quot;:&quot;official_strategy&quot;,&quot;dimensions&quot;:[&quot;trust_governance_constraints&quot;,&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;风险管理&quot;,&quot;技术开发&quot;,&quot;伦理标准&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/2024-06-RAI-STRATEGY-IMPLEMENTATION-PATHWAY.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-30E9B209F0439B21&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;ACE Program Achieves World First for AI in Aerospace&quot;,&quot;claim&quot;:&quot;AI与人类驾驶的F-16之间的空中作战测试显示了人机编队和可信自主的变革性进展。&quot;,&quot;excerptZh&quot;:&quot;AI与人类驾驶的F-16之间的空中作战测试显示了人机编队和可信自主的变革性进展。&quot;,&quot;excerptOriginal&quot;:&quot;In-air combat tests between AI- and human-piloted F-16s show transformational progress for human-machine teaming and trusted autonomy&quot;,&quot;nature&quot;:&quot;evaluation&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-004&q ot;sourceId&quot;:&quot;T0-PB-003&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2024-02-08&quot;,&quot;locator&quot;:&quot;web_paragraph_0015&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;,&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;REMA项目&quot;,&quot;开发周期&quot;,&quot;螺旋挑战&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2024/mission-autonomy&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-3FA6806CF267B04B&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;RACER Revs Up for Checkered Flag Goal of High-Speed, Off-Road Autonomy&quot;,&quot;claim&quot;:&quot;DARPA RACER 项目的目标是开发和演示自主技术，使无人地面车辆能够在非结构化越野地形中以车辆机械极限速度及达到或超过人类驾驶的速度和效率进行机动。&quot;,&quot;excerptZh&quot;:&quot;DARPA RACER 项目的目标是开发和演示自主技术，使无人地面车辆（UGV）能够在非结构化越野地形中，以车辆机械系统的极限速度以及达到或超过人类驾驶的速度和效率进行机动。&quot;,&quot;excerptOriginal&quot;:&quot;The DARPA RACER program’s goal is to develop and demonstrate autonomy technologies that enable unmanned ground vehicles (UGVs) to maneuver in unstructured off-road terrain at the limit of the vehicle’s mechanical systems and at, or beyond, human-driven speeds and efficiencies.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-001&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2022-01-13&quot;,&quot;locator&quot;:&quot;web_paragraph_0002&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;DARPA RACER&quot;,&quot;无人地面车辆自主性&quot;,&quot;越野机动&quot;],&quot;urlOrPath&quot;:&quot;http truct / U.S. Naval Forces Central Command&quot;,&quot;publishedAt&quot;:&quot;2023-01-09&quot;,&quot;locator&quot;:&quot;web_paragraph_0014&quot;,&quot;sourceType&quot;:&quot;official_combatant_command_application&quot;,&quot;dimensions&quot;:[&quot;human_machine_authority&quot;],&quot;topics&quot;:[&quot;unmanned systems&quot;,&quot;artificial intelligence&quot;,&quot;object detection&quot;],&quot;urlOrPath&quot;:&quot;https://www.navy.mil/Press-Office/News-Stories/Article/3262053/imsc-task-force-completes-maritime-exercise-with-unmanned-systems-ai/&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-4240F0405A11E43F&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Developing Algorithms that Make Decisions Aligned with Human Experts&quot;,&quot;claim&quot;:&quot;ITM计划收集人类和算法决策者的决定，并以盲法呈现给多名分诊专业人员，以衡量其委托意愿。&quot;,&quot;excerptZh&quot;:&quot;“我们将收集每个决策者的决策和响应，并以盲法方式呈现给多位分诊专业人员，”图雷克说。“这些分诊专业人员不会知道响应来自对齐算法、基线算法还是人类。我们可能会问这些分诊专业人员他们会委托给哪个决策者，从而衡量他们对特定决策者的信任意愿。”&quot;,&quot;excerptOriginal&quot;:&quot;“We’re going to collect the decisions, the responses from each of those decision-makers, and present those in a blinded fashion to multiple triage professionals,” Turek said. “Those triage professionals won’t know whether the response comes from an aligned algorithm or a baseline algorithm or from a human. And the question that we might pose to those triage professionals is which decision-maker would they delegate to, providing us a measure of their willingness to trust those particular decision-makers.”&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-001&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2022-03-03&quot;,&quot;locator&quot;:&quot;web_paragraph_0011&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;human_machine_authority&quot;,&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;ITM项目评估&quot;,&quot;信任衡量&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2022/algorithms-human-experts&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-425BAC0BC94181E0&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;RACER Revs Up for Checkered Flag Goal of High-Speed, Off-Road Autonomy&quot;,&quot;claim&quot;:&quot;RACER 的传感器和电子盒组合每小时收集四太字节的传感器数据，用于支持人工智能和机器学习自主算法。&quot;,&quot;excerptZh&quot;:&quot;传感器和电子盒的组合目前每小时收集四太字节的传感器数据，以支持复杂地形中快节奏战斗机动所需的人工智能、基于机器学习的自主算法和堆栈方法。&quot;,&quot;excerptOriginal&quot;:&quot;The sensor and E-box combination currently collects four terabytes of sensor data per hour to support artificial intelligence, machine learning-based autonomy algorithms and stack approaches required of fast-paced combat maneuvers in complex terrain.&quot;,&quot;nature&quot;:&quot;resource_input&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-001&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2022-01-13&quot;,&quot;locator&quot;:&quot;web_paragraph_0005&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;DARPA RACER&quot;,&quot;传感器数据&quot;,&quot;人工智能算法&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2022/racer-off-road-autonomy&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-03&quot;,&quot;relation&quot;:&quot;counter&quot;}],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-OPS-H03&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TRUST-H03&quot;,&quot;field&quot;:&quot;data_collection_rate&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H03&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-436559CE67256788&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;A New Take on Modeling &amp; Simulation for Improved Autonomy&quot;,&quot;claim&quot;:&quot;DARPA的TIAMAT项目正在寻求提案，以检验低保真模拟迁移自主性的理论。&quot;,&quot;excerptZh&quot;:&quot;“从不精确和抽象模型向自主技术迁移”项目寻求提案，以检验这一理论。&quot;,&quot;excerptOriginal&quot;:&quot;The Transfer from Imprecise and Abstract Models to Autonomous Technologies program seeks proposals that put this theory to the test.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-003&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2023-10-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0009&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;DARPA program&quot;,&quot;autonomy transfer&quot;,&quot;proposal solicitation&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2023/modeling-simulation-autonomy&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-451C2F294AC898A8&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;RACER’s Off-Road Autonomous Vehicles Teams Navigate Third Test&quot;,&quot;claim&quot;:&quot;陆军研究实验室研究人员展示了RACER表演团队自主软件的灵活性，该演示对向军种过渡能力至关重要，并标志着项目第一阶段完成。&quot;,&quot;excerptZh&quot;:&quot;此外，陆军研究实验室的研究人员展示了表演团队自主软件的灵活性，这对将RACER能力过渡到各军种至关重要。这完成了项目的第一阶段。&quot;,&quot;excerptOriginal&quot;:&quot;Additionally, researchers from the Army Research Laboratory demonstrated the flexibility of the performer team’s autonomy software, critical to transitioning RACER capabilites to the services. This completed the project’s first phase.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-002&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2023-04-11&quot;,&quot;locator&quot;:&quot;web_paragraph_0002&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;RACER项目&quot;,&quot;技术过渡&quot;,&quot;陆军研究实验室&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2023/off-road-autonomous-vehicles&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-48237E0AC6B28A09&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;A New Take on Modeling &amp; Simulation for Improved Autonomy&quot;,&quot;claim&quot;:&quot;DARPA专家推测，利用低保真模拟的共享语义进行自主性迁移，可能实现当天从模拟到现实的迁移，而传统方法需要数周或数月。&quot;,&quot;excerptZh&quot;:&quot;与高保真模拟的传统观点相反，DARPA专家推测，利用共享语义（如交战规则）在多样化的低保真模拟中学习和迁移自主性，可以更快地将自主性从模拟迁移到现实——甚至可能当天完成，而传统方法需要数周或数月。&quot;,&quot;excerptOriginal&quot;:&quot;Contrary to the conventional wisdom of high-fidelity simulation, DARPA experts theorize that learning and transferring autonomy across diverse, low-fidelity simulations leveraging their shared semantics (e.g., rules of engagement) instead can lead to a more rapid transfer of autonomy from simulation to reality – perhaps even as early as the same-day versus weeks/months with traditional approaches.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-003&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2023-10-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0008&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;sim-to-real transfer&quot;,&quot;low-fidelity simulation&quot;,&quot;autonomy learning&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2023/modeling-simulation-autonomy&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-4AC04F3FF13BAF68&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Should Improve Strategies, Inventory Process, and Collaboration Guidance&quot;,&quot;claim&quot;:&quot;初始后勤模型于2021年2月11日进行了演示。&quot;,&quot;excerptZh&quot;:&quot;初始后勤模型于2021年2月11日进行了演示。&quot;,&quot;excerptOriginal&quot;:&quot;The initial logistics model was demonstrated on February 11, 2021.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_20&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;AI模型演示&quot;,&quot;预测性维护&quot;,&quot;联合后勤任务倡议&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-51D65DEC82584BCD&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Should Improve Strategies, Inventory Process, and Collaboration Guidance&quot;,&quot;claim&quot;:&quot;预算和合同问题及COVID-19影响推迟了联合通用基金会达到全面作战能力，且预计日期尚未确定。&quot;,&quot;excerptZh&quot;:&quot;据JAIC官员和国防部文件称，预算和合同问题（例如联合企业防御基础设施云合同的取消）以及COVID-19的影响，推迟了联合通用基金会达到全面作战能力，且该里程碑的预计日期尚未确定。&quot;,&quot;excerptOriginal&quot;:&quot;According to a JAIC official and DOD documentation, budgetary and contracting issues (e.g., the cancellation of the Joint Enterprise Defense Infrastructure cloud contract), as well as the impacts of COVID-19, have delayed the Joint Common Foundation reaching full operational capability and an estimated date for that milestone has not been determined.&quot;,&quot;nature&quot;:&quot;constraint&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_82&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;,&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;企业架构&quot;,&quot;数据共享&quot;,&quot;跨平台集成&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-01&quot;,&quot;relation&quot;:&quot;counter&quot;},{&quot;id&quot;:&quot;HYP-T0-03&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-STRAT-H01&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TECH-H01&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-ENG-H01&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-ENG-H03&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H01&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H03&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TRUST-H01&quot;,&quot;field&quot;:&quot;platform_operational_status&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TRUST-H03&quot;,&quot;field&quot;:&quot;infrastructure_delay&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-ENG-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-ENG-H03&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H03&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-TECH-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-TRUST-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-542BC468B66F4EB7&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;DART and Coordinated Robotics Take Top Spots in the DARPA Triage Challenge Event 1 | DARPA&quot;,&quot;claim&quot;:&quot;DARPA分诊挑战赛第一场赛事中，准确快速识别关键损伤生理特征（如出血和气道损伤）的能力是成功的关键。&quot;,&quot;excerptZh&quot;:&quot;在DARPA分诊挑战赛第一场赛事中，准确快速识别关键损伤生理特征（如出血和气道损伤）的能力被证明是成功的关键。DART在系统竞赛中夺得第一名，而Coordinated Robotics在虚拟竞赛中位居榜首并在数据竞赛中获胜。&quot;,&quot;excerptOriginal&quot;:&quot;The ability to accurately and rapidly identify key physiological signatures of injury – such as hemorrhage and airway injuries – proved key to success in the DARPA Triage Challenge Event 1. DART took the top spot in the Systems competition, while Coordinated Robotics topped the leaderboard in the Virtual competition and pulled off the win in the Data competition.&quot;,&quot;nature&quot;:&quot;test_result&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-005&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2024-10-05&quot;,&quot;locator&quot;:&quot;web_paragraph_0001&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;DARPA Triage Challenge&quot;,&quot;生理特征识别&quot;,&quot;竞赛结果&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2024/dart-coordinated-robotics&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-54AE74809071D83B&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Developing Algorithms that Make Decisions Aligned with Human Experts&quot;,&quot;claim&quot;:&quot;ITM项目总时长3.5年，分两个阶段，第一阶段24个月聚焦小单位分诊，第二阶段18个月聚焦大规模伤亡事件。&quot;,&quot;excerptZh&quot;:&quot;ITM是一个为期3.5年的项目，包含两个阶段，并有可能进入第三阶段，与转型伙伴一起使技术成熟。第一阶段为期24个月，以小单位分诊作为决策场景。第二阶段为期18个月，通过关注大规模伤亡事件来增加决策复杂性。&quot;,&quot;excerptOriginal&quot;:&quot;ITM is a 3.5-year program encompassing two phases with potential for a third phase devoted to maturing the technology with a transition partner. The first phase is 24-months long and focuses on small-unit triage as the decision-making scenario. Phase 2 is 18-months long and increases decision-making complexity by focusing on mass-casualty events.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-001&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2022-03-03&quot;,&quot;locator&quot;:&quot;web_paragraph_0009&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;ITM项目时间表&quot;,&quot;项目阶段&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2022/algorithms-human-experts&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-582B12D4B09F11B1&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Responsible AI Strategy and Implementation Pathway&quot;,&quot;claim&quot;:&quot;美国国防部计划制定一个测试与评估框架，将测试与评估贯穿AI能力生命周期，并建立持续测试的路径和文档报告标准。&quot;,&quot;excerptZh&quot;:&quot;LOE 2.1.1：制定TEW框架，阐明测试与评估（T&amp;E）应如何贯穿AI能力的生命周期，并建立持续测试的路径和文档与报告的标准化。&quot;,&quot;excerptOriginal&quot;:&quot;LOE 2.1.1: Develop a TEW framework to articulate how test and CDAO in coordination evaluation (T&amp; E) should be intertwined across an Al capability&#x27;s with OUSD(R&amp;E) and lifecycle and pathways for continuous testing and standards for DOT&amp;E documentation and reporting.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-007&quot;,&quot;publisher&quot;:&quot;U.S. Department of Defense&quot;,&quot;publishedAt&quot;:&quot;2022-06-01&quot;,&quot;locator&quot;:&quot;pdf_page_24&quot;,&quot;sourceType&quot;:&quot;official_strategy&quot;,&quot;dimensions&quot;:[&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;测试评估框架&quot;,&quot;AI生命周期&quot;,&quot;持续测试&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/2024-06-RAI-STRATEGY-IMPLEMENTATION-PATHWAY.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-03&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-5EA556C2C939C121&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Data, Analytics, and Artificial Intelligence Adoption Strategy&quot;,&quot;claim&quot;:&quot;国防部领导人将优先采用已由联合或部门赞助的解决方案，其次才考虑公开市场能力。&quot;,&quot;excerptZh&quot;:&quot;国防部领导人将首先寻求采用已由联合或部门赞助的解决方案，然后再探索公开市场上可用的能力。&quot;,&quot;excerptOriginal&quot;:&quot;DoD leaders will first seek to adopt solutions that are already Joint- or Component-sponsored before exploring capabilities available on the open market.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-008&quot;,&quot;publisher&quot;:&quot;U.S. Department of Defense&quot;,&quot;publishedAt&quot;:&quot;2023-06-27&quot;,&quot;locator&quot;:&quot;pdf_page_15&quot;,&quot;sourceType&quot;:&quot;official_strategy&quot;,&quot;dimensions&quot;:[&q 向整合。&quot;,&quot;excerptZh&quot;:&quot;根据JAIC主任的说法，需要更新DOD AI战略，因为JAIC正将其重点从采用AI能力转向整合。&quot;,&quot;excerptOriginal&quot;:&quot;According to the Director of the JAIC, the updated DOD AI Strategy is needed as the JAIC shifts its focus from adoption of AI capabilities to integration.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_30&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;integration_level&quot;],&quot;topics&quot;:[&quot;战略转型&quot;,&quot;AI整合&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-01&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-TECH-H01&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H01&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-TECH-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-62B1ECDA7DF87F1A&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Data, Analytics, and Artificial Intelligence Adoption Strategy&quot;,&quot;claim&quot;:&quot;缺乏基于经测试标准的组织化方法，各组成部门将难以达到满足人工智能需求所需的数据质量水平。&quot;,&quot;excerptZh&quot;:&quot;若无基于经测试标准的组织化方法，各组成部门在达到满足分析与人工智能需求所需的数据质量水平方面将面临重大挑战。&quot;,&quot;excerptOriginal&quot;:&quot;Absent an organized approach based on tested criteria, Components will face significant challenges developing the level of data quality required to address analytics and artificial intelligence requirements.&quot;,&quot;nature&quot;:&quot;constraint&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-008&quot;,&quot;publisher&quot;:&quot;U.S. Department of Defense&quot;,&quot;publishedAt&quot;:&quot;2023-06-27&quot;,&quot;locator&quot;:&quot;pdf_page_25&quot;,&quot;sourceType&quot;:&quot;official_strategy&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;data quality&quot;,&quot;AI requirements&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/DOD_DATA_ANALYTICS_AI_ADOPTION_STRATEGY.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-03&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-STRAT-H03&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TECH-H03&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H03&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TRUST-H03&quot;,&quot;field&quot;:&quot;data_quality_constraint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H03&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-STRAT-H03&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-63E815AC3300FE8A&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Should Improve Strategies, Inventory Process, and Collaboration Guidance&quot;,&quot;claim&quot;:&quot;作为AI与数据加速计划的一部分，JAIC将派出数据和AI专家团队，帮助作战司令部快速将AI从实验室转移到实战。&quot;,&quot;excerptZh&quot;:&quot;作为这项新计划的一部分，JAIC将派出数据和AI专家组成的“飞行”团队，帮助作战司令部快速将AI从实验室转移到实战。&quot;,&quot;excerptOriginal&quot;:&quot;As a part of this new initiative, the JAIC will send out “flyaway” teams of data and AI experts to help combatant commands quickly shift AI from labs to real-world warfighting.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_pages_52_53&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;企业架构&quot;,&quot;数据共享&quot;,&quot;跨平台集成&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-6EAB90CE05FF523F&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;A New Take on Modeling &amp; Simulation for Improved Autonomy&quot;,&quot;claim&quot;:&quot;TIAMAT项目分为两个18个月的阶段，分别开发模拟到模拟和模拟到现实的自主性迁移技术，以及自动开发或改进低保真模型和模拟的方法。&quot;,&quot;excerptZh&quot;:&quot;该项目分为两个阶段。第一阶段为期18个月，将开发模拟到模拟的自主性迁移技术，以及自动开发或改进用于迁移的低保真模型和模拟的新方法。第二阶段为期18个月，将开发模拟到现实的自主性迁移技术，以及自动开发或改进用于迁移的低保真模型和模拟的新方法。&quot;,&quot;excerptOriginal&quot;:&quot;The program is organized into two phases. Phase 1 is 18 months and will develop sim-to-sim autonomy transfer techniques and novel methods for automatically developing or refining low-fidelity models and simulations to be used for transfer. Phase 2 is 18 months and will develop sim-to-real autonomy transfer techniques and novel methods for automatically developing or refining low-fidelity models and simulations to be used for transfer.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-003&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2023-10-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0014&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;program structure&quot;,&quot;sim-to-sim&quot;,&quot;sim-to-real&quot;,&quot;low-fidelity models&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2023/modeling-simulation-autonomy&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-6FE734DE05953A3C&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Responsible AI Strategy and Implementation Pathway&quot;,&quot;claim&quot;:&quot;国防部负责任人工智能实施需要灵活方法，需求和复杂性因技术成熟度和使用背景而异。&quot;,&quot;excerptZh&quot;:&quot;在国防部实施负责任人工智能不会通过一套僵化、一刀切的要求取得成功。需要灵活的方法来促进创新思维，因为需求和复杂性将根据技术成熟度和人工智能使用背景等因素而变化。&quot;,&quot;excerptOriginal&quot;:&quot;Implementing RAI in the DoD will not succeed with a set of rigid, one-size-fits-all requirements. A flexible approach is required to foster innovative thinking, as needs and complexity will vary based on factors such as technical maturity and context in which AI will be used.&quot;,&quot;nature&quot;:&quot;constraint&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-007&quot;,&quot;publisher&quot;:&quot;U.S. Department of Defense&quot;,&quot;publishedAt&quot;:&quot;2022-06-01&quot;,&quot;locator&quot;:&quot;pdf_page_16&quot;,&quot;sourceType&quot;:&quot;official_strategy&quot;,&quot;dimensions&quot;:[&quot;trust_governance_constraints&quot;,&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;采办工具包&quot;,&quot;采办流程&quot;,&quot;资源建设&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/2024-06-RAI-STRATEGY-IMPLEMENTATION-PATHWAY.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-03&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-TRUST-H03&quot;,&quot;field&quot;:&quot;rai_flexibility&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-772E45D0B54BCC9C&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;DARPA&#x27;s REMA Program to Add Mission Autonomy to Commercial Drones&quot;,&quot;claim&quot;:&quot;REMA项目已将无人机自主适配器接口合同授予Anduril和RTX，将任务特定自主软件合同授予Leidos、Northrop Grumman和SoarTech。&quot;,&quot;excerptZh&quot;:&quot;无人机自主适配器接口技术领域的合同已授予Anduril和RTX。任务特定自主软件技术领域的合同已授予Leidos、Northrop Grumman和SoarTech。&quot;,&quot;excerptOriginal&quot;:&quot;Contracts for the drone-autonomy adapter interface technical area have been awarded to Anduril and RTX. Contracts for the mission-specific autonomy software technical area have been awarded to Leidos, Northrop Grumman, and SoarTech.&quot;,&quot;nature&quot;:&quot;resource_input&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-PB-003&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2024-02-08&quot;,&quot;locator&quot;:&quot;web_paragraph_0014&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;REMA项目&quot;,&quot;合同授予&quot;,&quot;承包商&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2024/mission-autonomy&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-79B653E22A3D4EF4&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Cloud-based intel tool AIDP rolls out to Army units globally&quot;,&quot;claim&quot;:&quot;据2024年10月9日报道，约在2022年10月，AIDP曾在美国本土情报部队中接受压力测试和微调。&quot;,&quot;excerptZh&quot;:&quot;“24个月前，我们正与国内情报部队一起测试AIDP，试图对系统进行压力测试并微调系统以满足情报士兵的需求，”情报、电子战和传感器项目执行官Ed Barker准将说。&quot;,&quot;excerptOriginal&quot;:&quot;“24 months ago, we were testing AIDP with intel units stateside trying to stress the system and fine tune the system to meet the needs of intel soldiers,” Brig. Gen. Ed Barker, the Program Executive Officer for Intelligence, Electronic Warfare, and Sensors said.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-007&quot;,&quot;publisher&quot;:&quot;U.S. Army Program Executive Office Intelligence, Electronic Warfare &amp; Sensors&quot;,&quot;publishedAt&quot;:&quot;2024-10-09&quot;,&quot;locator&quot;:&quot;web_paragraph_0007&quot;,&quot;sourceType&quot;:&quot;official_service_application&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;AIDP测试&quot;,&quot;陆军情报&quot;],&quot;urlOrPath&quot;:&quot;https://cpeisw.army.mil/2024/10/09/277811/&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-02&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-7B65174669ACA9CE&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;ACE Program Achieves World First for AI in Aerospace&quot;,&quot;claim&quot;:&quot;ACE AI算法在2023年及2024年持续于爱德华兹空军基地控制X-62A测试飞机进行自主空战机动演示。&quot;,&quot;excerptZh&quot;:&quot;在飞行中，ACE AI算法控制了一架经过特殊改装的F-16测试飞机，即X-62A，或VISTA（可变飞行模拟器测试飞机），在加利福尼亚州爱德华兹空军基地的空军试飞员学校，所有自主空战机动演示于2023年进行，并持续到2024年。&quot;,&quot;excerptOriginal&quot;:&quot;In flight, the ACE AI algorithms controlled a specially modified F-16 test aircraft known as the X-62A, or VISTA (Variable In-flight Simulator Test Aircraft), at the Air Force Test Pilot School at Edwards Air Force Base, California, where all demonstrations of autonomous combat maneuvers took place in 2023 and are continuing in 2024.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-004&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2024-04-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0011&quot;,&quot;sourceType&quot;:&quot;official_test_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;integration_level&quot;],&quot;topics&quot;:[&quot;X-62A&quot;,&quot;自主空战机动&quot;,&quot;测试地点&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2024/ace-ai-aerospace&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-7E37FBD511FC654E&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Should Improve Strategies, Inventory Process, and Collaboration Guidance&quot;,&quot;claim&quot;:&quot;根据国防部文件，联合通用基金会将把不同的AI应用整合到一个单一平台下，并在整个部门扩展AI。&quot;,&quot;excerptZh&quot;:&quot;根据国防部文件，联合通用基金会将把不同的AI应用整合到一个单一平台下，并在整个部门扩展AI。&quot;,&quot;excerptOriginal&quot;:&quot;According to DOD documentation, the Joint Common Foundation will bring disparate AI applications under a single platform and scale AI across the department.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_45&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;integration_level&quot;],&quot;topics&quot;:[&quot;Joint Common Foundation&quot;,&quot;AI scaling&quot;,&quot;integration&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;protocol_low_risk_auto_accept&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-01&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-STRAT-H01&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TECH-H01&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-ENG-H01&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H01&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TRUST-H01&quot;,&quot;field&quot;:&quot;platform_intent&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-ENG-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-TECH-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-TRUST-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-7E3F813822CB52F8&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Developing Algorithms that Make Decisions Aligned with Human Experts&quot;,&quot;claim&quot;:&quot;ITM项目设有四个技术领域，包括决策者特征描述、人机对齐评分、项目评估以及政策与实践整合。&quot;,&quot;excerptZh&quot;:&quot;该项目有四个技术领域。第一个是开发决策者特征描述技术，以识别和量化困难领域中的关键决策者属性。第二个技术领域是创建人类决策者与算法之间的定量对齐分数，该分数可预测最终用户的信任。第三个技术领域负责设计和执行项目评估。最后一个技术领域负责政策与实践整合；为项目提供法律、道德和伦理专业知识；支持未来国防部政策和作战概念（CONOPS）的制定；监督伦理操作流程（DevEthOps）的开发；并向更广泛的政策界开展外联活动。&quot;,&quot;excerptOriginal&quot;:&quot;The program has four technical areas. The first is developing decision-maker characterization techniques that identify and quantify key decision-maker attributes in difficult domains. The second technical area is creating a quantitative alignment score between a human decision-maker and an algorithm in ways that are predictive of end-user trust. A third technical area is responsible for designing and executing the program evaluation. The final technical area is responsible for policy and practice integration; providing legal, moral, and ethical expertise to the program; supporting the development of future DoD policy and concepts of operations (CONOPS); overseeing development of an ethical operations process (DevEthOps); and conducting outreach events to the broader policy community.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-001&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2022-03-03&quot;,&quot;locator&quot;:&quot;web_paragraph_0008&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;ITM项目结构&quot;,&quot;技术领域&quot;,&quot;政策整合&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2022/algorithms-human-experts&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-7FD6156DA8592DF7&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Should Improve Strategies, Inventory Process, and Collaboration Guidance&quot;,&quot;claim&quot;:&quot;历史维护数据被用于训练AI模型，以预测超出正常时长的维护周期。&quot;,&quot;excerptZh&quot;:&quot;联合后勤任务倡议团队使用历史维护数据训练AI模型，以预测超出正常时长的维护周期。&quot;,&quot;excerptOriginal&quot;:&quot;The Joint Logistics Mission Initiative team is using historic maintenance data to train AI models to predict these longer than normal maintenance periods.&quot;,&quot;nature&quot;:&quot;resource_input&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_20&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;AI模型演示&quot;,&quot;预测性维护&quot;,&quot;联合后勤任务倡议&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-8414D2FA3AA1A98D&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;DART and Coordinated Robotics Take Top Spots in the DARPA Triage Challenge Event 1 | DARPA&quot;,&quot;claim&quot;:&quot;Systems Competition的目标是利用自主系统搭载的远距传感器采集的数据，检测并识别伤情生理特征。&quot;,&quot;excerptZh&quot;:&quot;Systems Competition的目标是利用自主系统搭载的远距传感器采集的数据，检测并识别伤情生理特征。&quot;,&quot;excerptOriginal&quot;:&quot;The objective of the Systems Competition is to detect and identify physiological signatures of injury derived from data captured by stand-off sensors onboard autonomous systems.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-005&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2024-10-05&quot;,&quot;locator&quot;:&quot;web_paragraph_0008&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;integration_level&quot;],&quot;topics&quot;:[&quot;DARPA Triage Challenge&quot;,&quot;系统竞赛目标&quot;,&quot;自主系统&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2024/dart-coordinated-robotics&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-850EF492D703EA37&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Onboard AI: Constraints and Limitations&quot;,&quot;claim&quot;:&quot;在许多情况下，机载AI的性能将不如最先进的模型。&quot;,&quot;excerptZh&quot;:&quot;然而，在许多情况下，机载AI将不如那些登上头条或在基准测试中取得高水平性能的最先进模型。&quot;,&quot;excerptOriginal&quot;:&quot;However, in many cases, onboard AI will be inferior to the state-of-the-art models that grab headlines or achieve high-level performance on benchmarks.&quot;,&quot;nature&quot;:&quot;constraint&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-TD-006&quot;,&quot;publisher&quot;:&quot;Center for Security and Emerging Technology (CSET), Georgetown University&quot;,&quot;publishedAt&quot;:&quot;2023-08-22&quot;,&quot;locator&quot;:&quot;web_paragraph_0016&quot;,&quot;sourceType&quot;:&quot;research_report&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;机载AI&quot;,&quot;性能&quot;,&quot;限制&quot;],&quot;urlOrPath&quot;:&quot;https://cset.georgetown.edu/publication/onboard-ai-constraints-and-limitations/&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-03&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-8BF4D983A68CB422&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;A New Take on Modeling &amp; Simulation for Improved Autonomy&quot;,&quot;claim&quot;:&quot;TIAMAT项目计划在第一和第二阶段结束时分别开展sim-to-sim和sim-to-real竞赛；第一场竞赛结果将用于将参与方从六个缩减为三个。&quot;,&quot;excerptZh&quot;:&quot;该项目将在第一阶段和第二阶段结束时分别举办模拟到模拟和模拟到现实的竞赛，第一次竞赛的结果将用于从六家执行者中筛选出三家。&quot;,&quot;excerptOriginal&quot;:&quot;The program will feature sim-to-sim and sim-to-real competitions at the end of Phases 1 and 2, respectively, with the results of the first competition being used to down-select from six performers to three.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-003&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2023-10-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0013&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topic
