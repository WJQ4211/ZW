rptZh&quot;:&quot;通过联合通用基金会，JAIC旨在消除重复工作并降低初始采用AI的挑战，为国防部各组织提供一个安全的空间，以共享构建、测试和部署AI应用所需的数据和算法。&quot;,&quot;excerptOriginal&quot;:&quot;Through the Joint Common Foundation, the JAIC aims to eliminate duplicative efforts and reduce the challenges to initial AI adoption by providing a secure space where DOD organizations can share data and algorithms needed to build, test, and field AI applications.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_44&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;Joint Common Foundation&quot;,&quot;AI adoption&quot;,&quot;data sharing&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-B33EF9F7AA480E81&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Cloud-based intel tool AIDP rolls out to Army units globally&quot;,&quot;claim&quot;:&quot;AIDP是首个在陆军情报云环境中全面部署的主要陆军情报项目。&quot;,&quot;excerptZh&quot;:&quot;此外，AIDP是第一个在陆军情报云环境中全面部署的主要陆军情报项目。&quot;,&quot;excerptOriginal&quot;:&quot;Additionally, AIDP is the first major Army Intel program to fully deploy in the Army Intel Cloud environment.&quot;,&quot;nature&quot;:&quot;deployment_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-007&quot;,&quot;publisher&quot;:&quot;U.S. Army Program Executive Office Intelligence, Electronic Warfare &amp; Sensors&quot;,&quot;publishedAt&quot;:&quot;2024-10-09&quot;,&quot;locator&quot;:&quot;web_paragraph_0012&quot;,&quot;sourceType&quot;:&quot;official_service_application&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;integration_level&quot;],&quot;topics&quot;:[&quot;AIDP部署&quot;,&quot;云环境&quot;],&quot;urlOrPath&quot;:&quot;https://cpeisw.army.mil/2024/10/09/277811/&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-B3AD2B72573BBD49&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;RACER’s Off-Road Autonomous Vehicles Teams Navigate Third Test&quot;,&quot;claim&quot;:&quot;DARPA RACER项目于2023年3月12日至27日进行了第三次实验，首次使用完全无人乘坐的RACER车队车辆，并由安全操作员在伴随车辆中监督。&quot;,&quot;excerptZh&quot;:&quot;DARPA的“复杂环境弹性机器人自主”（RACER）项目近期进行了第三次实验，以评估越野无人车的性能。这些测试于3月12日至27日进行，其中包括首次完全无人乘坐的RACER车队车辆（RFV），由一名安全操作员在伴随的追逐车辆中监督。&quot;,&quot;excerptOriginal&quot;:&quot;DARPA’s Robotic Autonomy in Complex Environments with Resiliency (RACER) program recently conducted its third experiment to assess the performance of off-road unmanned vehicles. These test runs, conducted March 12-27, included the first with completely uninhabited RACER Fleet Vehicles (RFVs), with a safety operator overseeing in a supporting chase vehicle.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-002&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2023-04-11&quot;,&quot;locator&quot;:&quot;web_paragraph_0001&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;human_machine_authority&quot;],&quot;topics&quot;:[&quot;RACER项目&quot;,&quot;无人地面车辆测试&quot;,&quot;人在回路中监督&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2023/off-road-autonomous-vehicles&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-B5B8C14BA4B90451&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Should Improve Strategies, Inventory Process, and Collaboration Guidance&quot;,&quot;claim&quot;:&quot;JAIC旨在开发一个企业架构，通过支持跨平台数据共享来容纳人工智能项目并连接国防部各组成部分。&quot;,&quot;excerptZh&quot;:&quot;据JAIC主任称，JAIC旨在开发一个企业架构，通过支持使用不同平台的各组成部分之间的数据共享，来容纳人工智能项目并连接国防部各组成部分。&quot;,&quot;excerptOriginal&quot;:&quot;According to the Director of the JAIC, the JAIC aims to develop an enterprise fabric to accommodate AI projects and interconnect DOD components by enabling data sharing across components using different platforms.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_83&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;integration_level&quot;],&quot;topics&quot;:[&quot;企业架构&quot;,&quot;数据共享&quot;,&quot;跨平台集成&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-BD7126374D17DC2A&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Responsible AI Strategy and Implementation Pathway&quot;,&quot;claim&quot;:&quot;美国国防部计划开发或采购AI测试与评估工具包，供AI开发者和测试者使用，并借鉴工业界和学术界的创新研究。&quot;,&quot;excerptZh&quot;:&quot;LOE 2.1.2：开发或采购AI相关的测试与评估工具，作为AI开发者和测试者的资源。该AI测试与评估工具包应借鉴工业界和学术界的创新研究及商业可用技术。&quot;,&quot;excerptOriginal&quot;:&quot;LOE 2.1.2: Develop or acquire Al-related T&amp;E tools to be used as a CDAO in coordination resource for Al developers and testers. This AI T &amp;E Toolkit shall with OUSD(R&amp;E) and draw upon best practices and innovative research from industry and DOT&amp;E the academic community, as well as commercially available technology where appropriate.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-007&quot;,&quot;publisher&quot;:&quot;U.S. Department of Defense&quot;,&quot;publishedAt&quot;:&quot;2022-06-01&quot;,&quot;locator&quot;:&quot;pdf_page_24&quot;,&quot;sourceType&quot;:&quot;official_strategy&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;,&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;测试评估工具&quot;,&quot;工具包开发&quot;,&quot;资源建设&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/2024-06-RAI-STRATEGY-IMPLEMENTATION-PATHWAY.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-C13F259540C77BFA&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Onboard AI: Constraints and Limitations&quot;,&quot;claim&quot;:&quot;机载AI的限制受到系统尺寸、重量和功率限制的影响。&quot;,&quot;excerptZh&quot;:&quot;这些限制受到许多系统的尺寸、重量和功率限制的影响。&quot;,&quot;excerptOriginal&quot;:&quot;These constraints are influenced by the size, weight, and power limitations of many systems.&quot;,&quot;nature&quot;:&quot;constraint&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-TD-006&quot;,&quot;publisher&quot;:&quot;Center for Security and Emerging Technology (CSET), Georgetown University&quot;,&quot;publishedAt&quot;:&quot;2023-08-22&quot;,&quot;locator&quot;:&quot;web_paragraph_0014&quot;,&quot;sourceType&quot;:&quot;research_report&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;机载AI&quot;,&quot;尺寸重量功率&quot;,&quot;限制&quot;],&quot;urlOrPath&quot;:&quot;https://cset.georgetown.edu/publication/onboard-ai-constraints-and-limitations/&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-C557AE16E4403328&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;IMSC Task Force Completes Maritime Exercise with Unmanned Systems, A.I.&quot;,&quot;claim&quot;:&quot;夏末的Sentinel Shield演习是IMSC规划人员首次专门设计以整合无人系统。&quot;,&quot;excerptZh&quot;:&quot;夏末的这次活动是IMSC规划人员首次专门设计Sentinel Shield演习以整合无人系统。&quot;,&quot;excerptOriginal&quot;:&quot;The late-summer event was the first time IMSC planners specifically designed a Sentinel Shield exercise to integrate unmanned systems.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-008&quot;,&quot;publisher&quot;:&quot;International Maritime Security Construct / U.S. Naval Forces Central Command&quot;,&quot;publishedAt&quot;:&quot;2023-01-09&quot;,&quot;locator&quot;:&quot;web_paragraph_0020&quot;,&quot;sourceType&quot;:&quot;official_combatant_command_application&quot;,&quot;dimensions&quot;:[&quot;integration_level&quot;],&quot;topics&quot;:[&quot;unmanned systems&quot;,&quot;exercise design&quot;],&quot;urlOrPath&quot;:&quot;https://www.navy.mil/Press-Office/News-Stories/Article/3262053/imsc-task-force-completes-maritime-exercise-with-unmanned-systems-ai/&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-02&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-C86CE008843D093B&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;DARPA&#x27;s REMA Program to Add Mission Autonomy to Commercial Drones&quot;,&quot;claim&quot;:&quot;REMA项目为期18个月，分为无人机自主适配器接口和任务特定自主软件两个技术领域。&quot;,&quot;excerptZh&quot;:&quot;这个为期18个月的单阶段项目分为两个技术领域：1）无人机自主适配器接口和2）任务特定自主软件。&quot;,&quot;excerptOriginal&quot;:&quot;The 18-month, single-phase program is divided into two technical areas: 1) A drone-autonomy adapter interface and 2) mission-specific autonomy software.&quot;,&quot;nature&quot;:&quot;resource_input&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-PB-003&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2024-02-08&quot;,&quot;locator&quot;:&quot;web_paragraph_0013&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;REMA项目&quot;,&quot;技术领域&quot;,&quot;自主适配器&quot;,&quot;自主软件&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2024/mission-autonomy&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-CA999183D4D473C4&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Should Improve Strategies, Inventory Process, and Collaboration Guidance&quot;,&quot;claim&quot;:&quot;2019年，JAIC开始开发联合通用基金会。&quot;,&quot;excerptZh&quot;:&quot;2019年，JAIC开始开发联合通用基金会，以创建一个部门范围内的数据共享平台，取代各组织在独立系统中维护其数据的做法，如图8所示。&quot;,&quot;excerptOriginal&quot;:&quot;In 2019, the JAIC began developing the Joint Common Foundation to create a department-wide data-sharing platform in lieu of each organization maintaining their data in separate systems as shown in figure 8.&quot;,&quot;nature&quot;:&quot;resource_input&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_44&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;,&quot;integration_level&quot;],&quot;topics&quot;:[&quot;企业架构&quot;,&quot;数据共享&quot;,&quot;跨平台集成&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-CB164026EB3FFB62&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Data, Analytics, and Artificial Intelligence Adoption Strategy&quot;,&quot;claim&quot;:&quot;经过严格测试被认为成功的能力将获得明确的维持和大规模采用途径。&quot;,&quot;excerptZh&quot;:&quot;经过严格测试被认为成功的能力将获得明确的维持和大规模采用途径。&quot;,&quot;excerptOriginal&quot;:&quot;Capabilities deemed successful after rigorous testing will receive clear pathways to sustainment and wide-scale adoption.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-008&quot;,&quot;publisher&quot;:&quot;U.S. Department of Defense&quot;,&quot;publishedAt&quot;:&quot;2023-06-27&quot;,&quot;locator&quot;:&quot;pdf_page_12&quot;,&quot;sourceType&quot;:&quot;official_strategy&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;测试&quot;,&quot;能力采用&quot;,&quot;维持&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/DOD_DATA_ANALYTICS_AI_ADOPTION_STRATEGY.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-D047B38066F7D303&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;A New Take on Modeling &amp; Simulation for Improved Autonomy&quot;,&quot;claim&quot;:&quot;为国防部平台在高保真环境中训练自主性模型可能需要数月甚至数年，且自主性在现实世界未知情况下脆弱，存在模拟到现实差距。&quot;,&quot;excerptZh&quot;:&quot;为国防部平台在高保真环境中训练模型有时可能需要数月甚至数年。此外，当面对现实世界中的未知情况或观测时，自主性会变得脆弱。这种脆弱性被称为模拟到现实（sim-to-real）差距。&quot;,&quot;excerptOriginal&quot;:&quot;Training models in high-fidelity environments for Defense Department platforms can sometimes take months to even years. Furthermore, autonomy becomes vulnerable when faced with unknown situations/observations in the real world. This brittleness is known as the simulation-to-real (sim-to-real) gap.&quot;,&quot;nature&quot;:&quot;constraint&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-003&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2023-10-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0006&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;,&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;sim-to-real gap&quot;,&quot;training time&quot;,&quot;vulnerability&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2023/modeling-simulation-autonomy&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-D8B6CB4040AF1B5B&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Should Improve Strategies, Inventory Process, and Collaboration Guidance&quot;,&quot;claim&quot;:&quot;JAIC计划在未来2至3年内使用敏捷方法更新和完善AI库存组合分析工具。&quot;,&quot;excerptZh&quot;:&quot;JAIC 2021年4月向国会提交的报告称，JAIC计划在未来2至3年内使用敏捷方法更新和完善AI库存组合分析工具。&quot;,&quot;excerptOriginal&quot;:&quot;The JAIC’s April 2021 report to Congress stated that the JAIC plans to update and refine the AI Inventory Portfolio Analytics Tool using Agile methods over the next 2 to 3 years.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_39&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;AI库存工具&quot;,&quot;开发计划&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-DB4536B8270ECF58&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;ACE Program Achieves World First for AI in Aerospace&quot;,&quot;claim&quot;:&quot;ACE项目首次实现了AI算法自主驾驶F-16与人类驾驶的F-16进行视距内空战测试。&quot;,&quot;excerptZh&quot;:&quot;DARPA的“空战演进”（ACE）项目实现了首次在空中测试中，AI算法自主驾驶F-16与人类驾驶的F-16进行视距内空战（有时称为“狗斗”）。&quot;,&quot;excerptOriginal&quot;:&quot;DARPA’s Air Combat Evolution (ACE) program has achieved the first-ever in-air tests of AI algorithms autonomously flying an F-16 against a human-piloted F-16 in within-visual-range combat scenarios (sometimes referred to as “dogfighting”).&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-004&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2024-04-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0009&quot;,&quot;sourceType&quot;:&quot;official_test_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;human_machine_authority&quot;],&quot;topics&quot;:[&quot;AI空战&quot;,&quot;自主飞行&quot;,&quot;ACE项目&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2024/ace-ai-aerospace&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-TECH-H02&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-DBEF932E1A5AD575&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Artificial Intelligence: DOD Should Improve Strategies, Inventory Process, and Collaboration Guidance&quot;,&quot;claim&quot;:&quot;JAIC官员表示，联合通用基金会于2021年3月实现了非机密能力的初始作战能力。&quot;,&quot;excerptZh&quot;:&quot;JAIC官员告诉我们，联合通用基金会的初始作战能力已于2021年3月以非机密能力实现。&quot;,&quot;excerptOriginal&quot;:&quot;JAIC officials told us that initial operational capability of the Joint Common Foundation was achieved in March 2021 with unclassified capabilities.&quot;,&quot;nature&quot;:&quot;deployment_event&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T0-IR-006&quot;,&quot;publisher&quot;:&quot;U.S. Government Accountability Office&quot;,&quot;publishedAt&quot;:&quot;2022-03-01&quot;,&quot;locator&quot;:&quot;pdf_page_82&quot;,&quot;sourceType&quot;:&quot;oversight_report&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;联合通用基金会&quot;,&quot;初始作战能力&quot;,&quot;时间节点&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/gao-22-105834.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-DD07FB77153E22F0&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Responsible AI Strategy and Implementation Pathway&quot;,&quot;claim&quot;:&quot;美国国防部计划要求AI供应商和开发者在能力部署前提供适当的培训和文档，以确保作战人员理解能力的功能、风险、性能预期和潜在危害。&quot;,&quot;excerptZh&quot;:&quot;LOE 2.2.1：要求AI供应商和开发者在能力部署前规划、提供适当的培训和文档（如用户手册），以确保作战人员对能力的功能、风险、性能预期和潜在危害有适当的理解。&quot;,&quot;excerptOriginal&quot;:&quot;LOE 2.2.1: Require Al vendors and developers to plan for, resource, DoD Component RAJ and provide appropriate training and documentation, such as user Leads manuals, to be used prior to capability fielding in order to e ns ure warfighters are equipped with a n appropriate understanding of the capability&#x27; s function, risks, performance expectations, and potential harms.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-SP-007&quot;,&quot;publisher&quot;:&quot;U.S. Department of Defense&quot;,&quot;publishedAt&quot;:&quot;2022-06-01&quot;,&quot;locator&quot;:&quot;pdf_page_26&quot;,&quot;sourceType&quot;:&quot;official_strategy&quot;,&quot;dimensions&quot;:[&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;培训要求&quot;,&quot;文档要求&quot;,&quot;部署前准备&quot;],&quot;urlOrPath&quot;:&quot;data/staging/t0_candidates/manual/2024-06-RAI-STRATEGY-IMPLEMENTATION-PATHWAY.pdf&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-DDA30BF3C0C38B0C&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;RACER’s Off-Road Autonomous Vehicles Teams Navigate Third Test&quot;,&quot;claim&quot;:&quot;RACER实验三中，团队完成超过55次无人驾驶运行，总里程246英里，总时长24.6小时，最高速度约25英里/小时，使用12辆RFV。&quot;,&quot;excerptZh&quot;:&quot;在最近的实验中，团队完成了超过55次无人驾驶运行，每次约4至11英里，速度达到约每小时25英里。表演者使用12辆RFV机器人车队在赛道上完成了246英里，总时长24.6小时。&quot;,&quot;excerptOriginal&quot;:&quot;During the most recent experiment, teams completed more than 55 driverless runs of between roughly four and 11 miles each, reaching speeds of about 25 miles per hour. The performers completed 246 miles over 24.6 total hours on course with a robotic fleet of 12 RFVs.&quot;,&quot;nature&quot;:&quot;test_result&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-002&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2023-04-11&quot;,&quot;locator&quot;:&quot;web_paragraph_0004&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;RACER项目&quot;,&quot;无人地面车辆性能&quot;,&quot;测试结果&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2023/off-road-autonomous-vehicles&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-TECH-H02&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-E4EADC8D35D78E4A&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;Cloud-based intel tool AIDP rolls out to Army units globally&quot;,&quot;claim&quot;:&quot;AIDP为未来集成大数据分析、人工智能和机器学习等技术奠定基础。&quot;,&quot;excerptZh&quot;:&quot;AIDP为未来技术集成（如大数据分析、人工智能和机器学习）奠定了基础。&quot;,&quot;excerptOriginal&quot;:&quot;AIDP sets the foundation for future technology integration such as big data analytics, artificial intelligence &amp; machine learning.&quot;,&quot;nature&quot;:&quot;evaluation&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-007&quot;,&quot;publisher&quot;:&quot;U.S. Army Program Executive Office Intelligence, Electronic Warfare &amp; Sensors&quot;,&quot;publishedAt&quot;:&quot;2024-10-09&quot;,&quot;locator&quot;:&quot;web_paragraph_0008&quot;,&quot;sourceType&quot;:&quot;official_service_application&quot;,&quot;dimensions&quot;:[&quot;integration_level&quot;],&quot;topics&quot;:[&quot;AIDP&quot;,&quot;人工智能集成&quot;],&quot;urlOrPath&quot;:&quot;https://cpeisw.army.mil/2024/10/09/277811/&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-E6EFA5142E5BA321&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;DART and Coordinated Robotics Take Top Spots in the DARPA Triage Challenge Event 1 | DARPA&quot;,&quot;claim&quot;:&quot;DARPA分诊挑战赛旨在推动损伤特征识别的突破性创新，以帮助医疗响应人员进行可扩展、及时和准确的分诊，特别关注大规模伤亡事件。&quot;,&quot;excerptZh&quot;:&quot;DARPA分诊挑战赛是一系列旨在推动医疗分诊新型生理特征发展的赛事。该挑战赛旨在推动损伤“特征”识别的突破性创新，以帮助医疗响应人员进行可扩展、及时和准确的分诊。特别关注大规模伤亡事件，包括民用和军事场景，此时医疗资源相对于需求有限。&quot;,&quot;excerptOriginal&quot;:&quot;The DARPA Triage Challenge is a series of events designed to spur development of novel physiological features for medical triage. The DARPA Triage Challenge aims to drive breakthrough innovations in identification of “signatures” of injury that will help medical responders perform scalable, timely, and accurate triage. Of particular interest are mass casualty incidents, in both civilian and military settings, when medical resources are limited relative to the need.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-005&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2024-10-05&quot;,&quot;locator&quot;:&quot;web_paragraph_0003&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;DARPA Triage Challenge&quot;,&quot;医疗分诊&quot;,&quot;创新目标&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2024/dart-coordinated-robotics&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-E7853897E7615DB9&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;DART and Coordinated Robotics Take Top Spots in the DARPA Triage Challenge Event 1 | DARPA&quot;,&quot;claim&quot;:&quot;DARPA分诊挑战赛第一场系统竞赛于2024年9月28日至10月4日在佐治亚州佩里市举行，11支队伍穿越了模拟飞机坠毁、车队伏击和战场场景的路线；虚拟竞赛和数据竞赛分别于2024年8月至9月举行，结果于2024年10月5日公布。&quot;,&quot;excerptZh&quot;:&quot;在第一场赛事的系统竞赛中，代表多个国家的11支队伍于2024年9月28日至10月4日在佐治亚州佩里市穿越了模拟飞机坠毁现场、车队伏击和战场场景的三条路线。DARPA设计这些路线以代表复杂的城市和农村基础设施。虚拟竞赛于2024年8月12日至9月10日举行，数据竞赛提交窗口于2024年7月30日至8月30日开放，所有三项竞赛的结果于2024年10月5日公布。&quot;,&quot;excerptOriginal&quot;:&quot;In the Systems competition of the first event, eleven teams representing multiple countries navigated three courses winding through a simulated airplane crash site, a convoy ambush, and a battlefield scenario in Perry, Georgia, September 28-October 4, 2024. DARPA designed the courses to represent complex urban and rural infrastructure. The Virtual competition took place August 12- September 10, 2024, and the Data competition submission window was open from July 30- August 30, 2024, for teams to submit their solutions with results for all three competitions announced on October 5, 2024.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-005&quot;,&quot;publisher&quot;:&quot;Defense Advanced Research Projects Agency (DARPA)&quot;,&quot;publishedAt&quot;:&quot;2024-10-05&quot;,&quot;locator&quot;:&quot;web_paragraph_0005&quot;,&quot;sourceType&quot;:&quot;official_program_news&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;DARPA Triage Challenge&quot;,&quot;系统竞赛&quot;,&quot;赛事时间&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2024/dart-coordinated-robotics&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;EV-T0-F0773C8E2ECB5C8D&quot;,&quot;snapshot&quot;:&quot;T0&quot;,&quot;title&quot;:&quot;IMSC Task Force Completes Maritime Exercise with Unmanned Systems, A.I.&quot;,&quot;claim&quot;:&quot;2023年1月9日，IMSC在阿拉伯湾完成为期三天的海上演习，整合了无人系统和人工智能，这是六个月内第二次此类演习。&quot;,&quot;excerptZh&quot;:&quot;国际海上安全构架（IMSC）于1月9日在阿拉伯湾完成了一次为期三天的海上演习，这是六个月内第二次在海军演习中整合无人系统和人工智能。&quot;,&quot;excerptOriginal&quot;:&quot;The International Maritime Security Construct (IMSC) completed a three-day maritime exercise in the Arabian Gulf, Jan. 9, integrating unmanned systems and artificial intelligence during a naval drill for the second time in six months.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T0-TD-008&quot;,&quot;publisher&quot;:&quot;International Maritime Security Construct / U.S. Naval Forces Central Command&quot;,&quot;publishedAt&quot;:&quot;2023-01-09&quot;,&quot;locator&quot;:&quot;web_paragraph_0007&quot;,&quot;sourceType&quot;:&quot;official_combatant_command_application&quot;,&quot;dimensions&quot;:[&quot;integration_level&quot;,&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;unmanned systems&quot;,&quot;artificial intelligence&quot;,&quot;maritime exercise&quot;],&quot;urlOrPath&quot;:&quot;https://www.navy.mil/Press-Office/News-Stories/Article/3262053/imsc-task-force-completes-maritime-exercise-with-unmanned-systems-ai/&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[{&quot;id&quot;:&quot;HYP-T0-02&quot;,&quot;relation&quot;:&quot;support&quot;}],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-OPS-H02&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;T0正式依赖&quot;},{&quot;id&quot;:&quot;VP-T0-TRUST-H02&quot;,&quot;field&quot;:&quot;exercise_integration&quot;,&quot;relation& ot;VP-T0-STRAT-H02&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-STRAT-H02&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-A66D49255D61B484&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;DAF launches plan to bolster AI workforce&quot;,&quot;claim&quot;:&quot;该计划提议创建美国空军部双轨职业模型，以支持AI专业人员的技术专家晋升路径。&quot;,&quot;excerptZh&quot;:&quot;一项关键提议是创建美国空军部双轨职业模型，为AI专业人员（包括具有专业文职经验的国民警卫队和预备役人员）开辟技术专家晋升路径，而不必被迫进入传统管理岗位。&quot;,&quot;excerptOriginal&quot;:&quot;A key proposal is the creation of a Department of the Air Force Dual-Track Career Model which will pave the way for AI professionals, including those in the Guard and Reserve with specialized civilian experience, to advance as technical experts without being forced into traditional management roles.&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-002&quot;,&quot;publisher&quot;:&quot;Department of the Air Force&quot;,&quot;publishedAt&quot;:&quot;2026-04-28&quot;,&quot;locator&quot;:&quot;web_paragraph_0004&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;,&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;AI人才保留&quot;,&quot;职业发展模型&quot;],&quot;urlOrPath&quot;:&quot;https://www.af.mil/News/Article-Display/Article/4472626/daf-launches-plan-to-bolster-ai-workforce/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-STRAT-H01&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;qualify&quot;,&quot;phase&quot;:&quot;T1字段影响&quot;},{&quot;id&quot;:&quot;VP-T0-STRAT-H02&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot;,&quot;relation&quot;:&quot;qualify&quot;,&quot;phase&quot;:&quot;T1字段影响&quot;},{&quot;id&quot;:&quot;VP-T0-STRAT-H01&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-STRAT-H02&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-STRAT-H02&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-9865C47D4C68375C&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Air Force advances secure AI capabilities with IL5 approval for VIA’s&quot;,&quot;claim&quot;:&quot;空军部授予Via Science公司的eJARVIS应用程序Impact Level 5运营授权。&quot;,&quot;excerptZh&quot;:&quot;空军部已授予Via Science公司（一家领先的人工智能技术提供商）其eJARVIS应用程序的Impact Level 5运营授权。&quot;,&quot;excerptOriginal&quot;:&quot;The Department of the Air Force has awarded Via Science, Inc., a leading provider of AI technologies, Impact Level 5 Authority to Operate for its eJARVIS application.&quot;,&quot;nature&quot;:&quot;governance_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-003&quot;,&quot;publisher&quot;:&quot;U.S. Air Force&quot;,&quot;publishedAt&quot;:&quot;2026-04-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0004&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;AI治理&quot;,&quot;安全授权&quot;],&quot;urlOrPath&quot;:&quot;https://www.af.mil/News/Article-Display/Article/4463303/air-force-advances-secure-ai-capabilities-with-il5-approval-for-vias-ejarvis/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[{&quot;id&quot;:&quot;DISAG-T1R-C1-01&quot;,&quot;branch&quot;:&quot;branch_a&quot;}]},{&quot;id&quot;:&quot;CE-T1-0BF350B1F14580F5&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Air Force advances secure AI capabilities with IL5 approval for VIA’s&quot;,&quot;claim&quot;:&quot;空军部副助理部长Nancy Balkus表示，eJARVIS使作战人员能在几分钟而非几周内访问关键设施能源数据，加快决策且不损害安全性。&quot;,&quot;excerptZh&quot;:&quot;“空军部致力于负责任地加速人工智能集成以加强作战准备，”空军基础设施、能源和环境副助理部长Nancy Balkus说。“确保设施能源数据的可用性和韧性对空军部的力量投送至关重要，eJARVIS使我们能够在几分钟而不是几周内为作战人员提供这些关键信息的访问，加快决策而不损害安全性。”&quot;,&quot;excerptOriginal&quot;:&quot;“The Department of the Air Force is committed to responsibly accelerating AI integration to strengthen operational readiness,” said Nancy Balkus , deputy assistant secretary of the Air Force for Infrastructure, Energy and Environment. “Ensuring the availability and resilience of installation energy data is critical to DAF&#x27;s power projection, and eJARVIS allows us to provide warfighters with access to this critical information in minutes rather than weeks, speeding decisions without compromising security.”&quot;,&quot;nature&quot;:&quot;evaluation&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-003&quot;,&quot;publisher&quot;:&quot;U.S. Air Force&quot;,&quot;publishedAt&quot;:&quot;2026-04-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0006&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;作战准备&quot;,&quot;数据访问&quot;],&quot;urlOrPath&quot;:&quot;https://www.af.mil/News/Article-Display/Article/4463303/air-force-advances-secure-ai-capabilities-with-il5-approval-for-vias-ejarvis/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-TRUST-H03&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[{&quot;id&quot;:&quot;DISAG-T1R-C1-03&quot;,&quot;branch&quot;:&quot;branch_a&quot;}]},{&quot;id&quot;:&quot;CE-T1-6C755FA494AD4E9A&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Air Force advances secure AI capabilities with IL5 approval for VIA’s&quot;,&quot;claim&quot;:&quot;eJARVIS的IL5授权扩大了其可分析数据范围，超越了2024年5月获得的IL4能力。&quot;,&quot;excerptZh&quot;:&quot;IL5是存储和处理特殊类型受控非机密信息的指定级别，需要比标准CUI更高水平的保护。提升至IL5扩大了eJARVIS生成式人工智能解决方案可分析的数据范围，使其覆盖范围和价值超越了2024年5月授予的IL4能力。&quot;,&quot;excerptOriginal&quot;:&quot;IL5 is a designation for storing and processing specialized types of Controlled Unclassified Information that require a higher level of protection than standard CUI. The increase to IL5 expands the range of data that eJARVIS’ generative artificial intelligence solution can analyze, increasing its reach and value beyond the IL4 capability awarded in May 2024.&quot;,&quot;nature&quot;:&quot;governance_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-003&quot;,&quot;publisher&quot;:&quot;U.S. Air Force&quot;,&quot;publishedAt&quot;:&quot;2026-04-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0007&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;,&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;数据安全&quot;,&quot;AI能力扩展&quot;],&quot;urlOrPath&quot;:&quot;https://www.af.mil/News/Article-Display/Article/4463303/air-force-advances-secure-ai-capabilities-with-il5-approval-for-vias-ejarvis/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-7DE738404CD33807&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Air Force advances secure AI capabilities with IL5 approval for VIA’s&quot;,&quot;claim&quot;:&quot;2024年初，eJARVIS成为早期获得运营授权的生成式AI应用之一。&quot;,&quot;excerptZh&quot;:&quot;2024年初，eJARVIS实现了一个重要里程碑，成为早期获得运营授权的生成式人工智能应用程序之一。&quot;,&quot;excerptOriginal&quot;:&quot;In early 2024, eJARVIS achieved a significant milestone when it became one of the early generative AI applications to achieve Authority to Operate.&quot;,&quot;nature&quot;:&quot;governance_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-003&quot;,&quot;publisher&quot;:&quot;U.S. Air Force&quot;,&quot;publishedAt&quot;:&quot;2026-04-17&quot;,&quot;locator&quot;:&quot;web_paragraph_0008&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;AI授权&quot;,&quot;里程碑&quot;],&quot;urlOrPath&quot;:&quot;https://www.af.mil/News/Article-Display/Article/4463303/air-force-advances-secure-ai-capabilities-with-il5-approval-for-vias-ejarvis/&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-2EC1A86FF3D5DEEF&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Space Force integrates with Air Force in AI sprint to ensure mission d&quot;,&quot;claim&quot;:&quot;美国空军在拉斯维加斯举办了一次为期两周的名为MASH的人机编队多决策优势冲刺实验。&quot;,&quot;excerptZh&quot;:&quot;为了在未来的对抗环境中确保任务优势，联合部队必须比任何对手更快地做出决策。这一要求是最近在拉斯维加斯举办的为期两周的复杂实验——人机编队多决策优势冲刺（MASH）背后的驱动力。&quot;,&quot;excerptOriginal&quot;:&quot;To secure mission dominance in a future, contested environment, the Joint Force must make decisions faster than any adversary. This imperative was the driving force behind the Multi-Decision Advantage Sprint for Human-Machine Teaming, or MASH, a complex, two-week experiment recently hosted in Las Vegas.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-004&quot;,&quot;publisher&quot;:&quot;United States Space Force&quot;,&quot;publishedAt&quot;:&quot;2026-06-30&quot;,&quot;locator&quot;:&quot;web_paragraph_0005&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;MASH实验&quot;,&quot;人机编队&quot;,&quot;实验活动&quot;],&quot;urlOrPath&quot;:&quot;https://www.spaceforce.mil/News/Article-Display/Article/4530561/space-force-integrates-with-air-force-in-ai-sprint-to-ensure-mission-dominance/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[{&quot;id&quot;:&quot;DISAG-T1R-C1-01&quot;,&quot;branch&quot;:&quot;branch_b&quot;}]},{&quot;id&quot;:&quot;CE-T1-13704D059FDF383D&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Space Force integrates with Air Force in AI sprint to ensure mission d&quot;,&quot;claim&quot;:&quot;美国太空军人员首次参加MASH实验，与空军人员及软件开发者共同评估工具集成。&quot;,&quot;excerptZh&quot;:&quot;美国太空军卫士首次与空军士兵并肩工作，与软件开发者一起评估这些不同工具如何有效集成，以解决跨空中、太空、网络、海上和地面领域的复杂问题。&quot;,&quot;excerptOriginal&quot;:&quot;For the first time, U.S. Space Force Guardians joined Airmen to work side-by-side with software developers, evaluating how these disparate tools can effectively integrate to solve complex problems across the air, space, cyber, maritime and ground domains.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-004&quot;,&quot;publisher&quot;:&quot;United States Space Force&quot;,&quot;publishedAt&quot;:&quot;2026-06-30&quot;,&quot;locator&quot;:&quot;web_paragraph_0006&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;integration_level&quot;,&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;太空军参与&quot;,&quot;跨域集成&quot;,&quot;MASH实验&quot;],&quot;urlOrPath&quot;:&quot;https://www.spaceforce.mil/News/Article-Display/Article/4530561/space-force-integrates-with-air-force-in-ai-sprint-to-ensure-mission-dominance/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-6FA016A513CC103A&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Space Force integrates with Air Force in AI sprint to ensure mission d&quot;,&quot;claim&quot;:&quot;MASH实验由空军部ABMS跨职能团队领导，与空军研究实验室、太空军和第805战斗训练中队合作执行。&quot;,&quot;excerptZh&quot;:&quot;MASH实验在拉斯维加斯一个专门的影子作战中心-内利斯设施内进行，由空军部先进战斗管理系统跨职能团队领导，并与空军研究实验室、美国太空军以及第805战斗训练中队（又称ShOC-N）合作执行。&quot;,&quot;excerptOriginal&quot;:&quot;Conducted within a dedicated Shadow Operations Center-Nellis facility in Las Vegas, the MASH experiment set the stage for this strategic collaboration, led by the Department of the Air Force’s Advanced Battle Management System Cross-Functional Team. The experiment was executed in partnership with the Air Force Research Lab , U.S. Space Force, and the 805th Combat Training Squadron , also known as the ShOC-N&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-004&quot;,&quot;publisher&quot;:&quot;United States Space Force&quot;,&quot;publishedAt&quot;:&quot;2026-06-30&quot;,&quot;locator&quot;:&quot;web_paragraph_0008&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;integration_level&quot;,&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;MASH实验&quot;,&quot;组织合作&quot;,&quot;ABMS&quot;],&quot;urlOrPath&quot;:&quot;https://www.spaceforce.mil/News/Article-Display/Article/4530561/space-force-integrates-with-air-force-in-ai-sprint-to-ensure-mission-dominance/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-C631674EB5FED17F&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Space Force integrates with Air Force in AI sprint to ensure mission d&quot;,&quot;claim&quot;:&quot;在MASH实验中，太空军卫士直接参与并影响了涵盖太空领域的战斗管理工具开发。&quot;,&quot;excerptZh&quot;:&quot;多决策冲刺的一个显著特征是太空军卫士的积极参与。卫士们超越了观察角色，直接参与并影响了涵盖太空领域的战斗管理工具的开发。&quot;,&quot;excerptOriginal&quot;:&quot;A defining feature of the multi-decision sprint was the active participation of Space Force Guardians. Moving beyond observational roles, Guardians were \&quot;in the seat,\&quot; directly influencing the development of battle management tools that encompass the space domain.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-004&quot;,&quot;publisher&quot;:&quot;United States Space Force&quot;,&quot;publishedAt&quot;:&quot;2026-06-30&quot;,&quot;locator&quot;:&quot;web_paragraph_0010&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;太空军参与&quot;,&quot;战斗管理工具&quot;,&quot;人机协作&quot;],&quot;urlOrPath&quot;:&quot;https://www.spaceforce.mil/News/Article-Display/Article/4530561/space-force-integrates-with-air-force-in-ai-sprint-to-ensure-mission-dominance/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-6B0D6E320A21509E&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Space Force integrates with Air Force in AI sprint to ensure mission d&quot;,&quot;claim&quot;:&quot;据参与者报告，MASH实验的一个重大突破是成功集成了不同的供应商工具。&quot;,&quot;excerptZh&quot;:&quot;该活动的一个重大突破是成功集成了这些不同的供应商工具。&quot;,&quot;excerptOriginal&quot;:&quot;A major breakthrough of the event was the successful integration of these disparate vendor tools.&quot;,&quot;nature&quot;:&quot;test_result&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-004&quot;,&quot;publisher&quot;:&quot;United States Space Force&quot;,&quot;publishedAt&quot;:&quot;2026-06-30&quot;,&quot;locator&quot;:&quot;web_paragraph_0027&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;integration_level&quot;],&quot;topics&quot;:[&quot;工具集成&quot;,&quot;MASH实验&quot;,&quot;技术突破&quot;],&quot;urlOrPath&quot;:&quot;https://www.spaceforce.mil/News/Article-Display/Article/4530561/space-force-integrates-with-air-force-in-ai-sprint-to-ensure-mission-dominance/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[{&quot;id&quot;:&quot;DISAG-T1R-C1-02&quot;,&quot;branch&quot;:&quot;branch_b&quot;}]},{&quot;id&quot;:&quot;CE-T1-8FF394626242D949&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Space Force integrates with Air Force in AI sprint to ensure mission d&quot;,&quot;claim&quot;:&quot;据参与者报告，在MASH实验中，一名空军上尉报告称，使用工具后，完成的任务数量从一项增加到五六项。&quot;,&quot;excerptZh&quot;:&quot;“一周前，我和我的团队完成一项任务需要50分钟到一个小时。在工具的帮助下，我们能够完成五六项任务，”美国空军第552作战支援中队ABM上尉亚当·索奇亚说。&quot;,&quot;excerptOriginal&quot;:&quot;“A week ago, it took my team and me 50 minutes to an hour to get one tasking done. With the help of the tool, we were able to get five or six taskings done,” said U.S. Air Force Capt. Adam Sochia, 552nd Operations Support Squadron ABM.&quot;,&quot;nature&quot;:&quot;test_result&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-004&quot;,&quot;publisher&quot;:&quot;United States Space Force&quot;,&quot;publishedAt&quot;:&quot;2026-06-30&quot;,&quot;locator&quot;:&quot;web_paragraph_0033&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;任务效率&quot;,&quot;工具效果&quot;,&quot;MASH实验&quot;],&quot;urlOrPath&quot;:&quot;https://www.spaceforce.mil/News/Article-Display/Article/4530561/space-force-integrates-with-air-force-in-ai-sprint-to-ensure-mission-dominance/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-7AB164824EAAD82A&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Air Force experiments with AI, boosts battle management speed, accurac&quot;,&quot;claim&quot;:&quot;据官方披露的初步结果，DASH 2 的初步结果显示，机器在不到十秒内产生建议，并生成比纯人类团队多30倍的选项。&quot;,&quot;excerptZh&quot;:&quot;初步结果显示，机器在不到十秒内产生建议，并生成比纯人类团队多30倍的选项。&quot;,&quot;excerptOriginal&quot;:&quot;Initial results showed that machines produced recommendations in less than ten seconds and generated 30 times more options than human-only teams.&quot;,&quot;nature&quot;:&quot;test_result&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-006&quot;,&quot;publisher&quot;:&quot;U.S. Air Force&quot;,&quot;publishedAt&quot;:&quot;2025-07-29&quot;,&quot;locator&quot;:&quot;web_paragraph_0009&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;DASH 2实验结果&quot;,&quot;机器性能&quot;,&quot;决策速度&quot;],&quot;urlOrPath&quot;:&quot;https://www.af.mil/News/Article-Display/Article/4310090/air-force-experiments-with-ai-boosts-battle-management-speed-accuracy/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[{&quot;id&quot;:&quot;DISAG-T1R-C1-02&quot;,&quot;branch&quot;:&quot;branch_b&quot;}]},{&quot;id&quot;:&quot;CE-T1-11BE4D003ECA817F&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Air Force experiments with AI, boosts battle management speed, accurac&quot;,&quot;claim&quot;:&quot;据官方披露的初步结果，在DASH 2中，两家供应商各自在一小时内为大约20个问题生成了超过6000个解决方案。&quot;,&quot;excerptZh&quot;:&quot;两家供应商各自在一小时内为大约20个问题生成了超过6000个解决方案。&quot;,&quot;excerptOriginal&quot;:&quot;Two vendors each produced more than 6,000 solutions for roughly 20 problems in just one hour.&quot;,&quot;nature&quot;:&quot;test_result&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-006&quot;,&quot;publisher&quot;:&quot;U.S. Air Force&quot;,&quot;publishedAt&quot;:&quot;2025-07-29&quot;,&quot;locator&quot;:&quot;web_paragraph_0009&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;DASH 2实验结果&quot;,&quot;供应商产出&quot;,&quot;解决方案数量&quot;],&quot;urlOrPath&quot;:&quot;https://www.af.mil/News/Article-Display/Article/4310090/air-force-experiments-with-ai-boosts-battle-management-speed-accuracy/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-TRUST-H03&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-06554E1EE0D2B6C0&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Air Force experiments with AI, boosts battle management speed, accurac&quot;,&quot;claim&quot;:&quot;据官方披露的初步结果，DASH 2中开发的软件在准确性上与人类表现相当，尽管开发时间只有两周。&quot;,&quot;excerptZh&quot;:&quot;尽管只有两周的开发时间，该软件的准确性与人类表现相当。&quot;,&quot;excerptOriginal&quot;:&quot;The software’s accuracy was on par with human performance, despite only two weeks of development.&quot;,&quot;nature&quot;:&quot;test_result&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-006&quot;,&quot;publisher&quot;:&quot;U.S. Air Force&quot;,&quot;publishedAt&quot;:&quot;2025-07-29&quot;,&quot;locator&quot;:&quot;web_paragraph_0009&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;],&quot;topics&quot;:[&quot;DASH 2实验结果&quot;,&quot;软件准确性&quot;,&quot;开发周期&quot;],&quot;urlOrPath&quot;:&quot;https://www.af.mil/News/Article-Display/Article/4310090/air-force-experiments-with-ai-boosts-battle-management-speed-accuracy/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-TRUST-H03&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-DCF49FC6CBC68958&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Luke AFB Airmen pioneer AI integration for daily operations&quot;,&quot;claim&quot;:&quot;卢克空军基地的这项工作成为该基地AI工作队的基石，该团队旨在探索AI在基地日常运营中的应用。&quot;,&quot;excerptZh&quot;:&quot;这项工作成为卢克AI工作队的基石，该团队旨在探索人工智能如何重塑日常运营、保存机构知识，并让飞行员有更多时间专注于任务中的人为因素。&quot;,&quot;excerptOriginal&quot;:&quot;The effort became the foundation of Luke&#x27;s AI Task Force, a team built to explore how artificial intelligence could reshape daily operations, preserve institutional knowledge and give Airmen more time to focus on the human elements of the mission.&quot;,&quot;nature&quot;:&quot;governance_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-007&quot;,&quot;publisher&quot;:&quot;U.S. Air Force&quot;,&quot;publishedAt&quot;:&quot;2026-05-18&quot;,&quot;locator&quot;:&quot;web_paragraph_0005&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;AI任务部队&quot;,&quot;组织建设&quot;],&quot;urlOrPath&quot;:&quot;https://www.af.mil/News/Article-Display/Article/4495022/luke-afb-airmen-pioneer-ai-integration-for-daily-operations/&quot;,&quot;changeSigna 01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-OPS-H02&quot;,&quot;field&quot;:&quot;mechanism_claims[0]&quot;,&quot;relation&quot;:&quot;qualify&quot;,&quot;phase&quot;:&quot;T1字段影响&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-BB675BA36EB74B19&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;732nd AMS leverages artificial intelligence to enhance Arctic TTX&quot;,&quot;claim&quot;:&quot;演习使用人工智能技术进行了定制，以反映第732空中机动中队的北极作战环境。&quot;,&quot;excerptZh&quot;:&quot;该演习进一步使用人工智能技术进行定制，以反映第732空中机动中队独特的北极作战环境。&quot;,&quot;excerptOriginal&quot;:&quot;The exercise was further tailored using artificial intelligence technology to reflect the 732nd AMS’s unique Arctic operating environment.&quot;,&quot;nature&quot;:&quot;test_event&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DAF-008&quot;,&quot;publisher&quot;:&quot;U.S. Air Force&quot;,&quot;publishedAt&quot;:&quot;2026-06-04&quot;,&quot;locator&quot;:&quot;web_paragraph_0004&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;人工智能应用&quot;,&quot;演习定制&quot;,&quot;北极环境&quot;],&quot;urlOrPath&quot;:&quot;https://www.af.mil/News/Article-Display/Article/4507566/732nd-ams-leverages-artificial-intelligence-to-enhance-arctic-ttx/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-OPS-H02&quot;,&quot;field&quot;:&quot;mechanism_claims[0]&quot;,&quot;relation&quot;:&quot;qualify&quot;,&quot;phase&quot;:&quot;T1字段影响&quot;}],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-6B02747FAF17B29F&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;732nd AMS leverages artificial intelligence to enhance Arctic TTX&quot;,&quot;claim&quot;:&quot;第732空中机动中队使用了 们共同提供数据、独立验证和确认以及技术专长，以确保对分诊解决方案进行严格评估。&quot;,&quot;excerptOriginal&quot;:&quot;The DARPA Triage Challenge is strengthened by the contributions of government and industry partners, including the Naval Information Warfare Center, the Johns Hopkins University Applied Physics Laboratory, the US Army Institute of Surgical Research, the University of Maryland, Baltimore, and the University of Pittsburgh, who collectively provide data, independent verification and validation, and technical expertise to ensure rigorous evaluation of triage solutions.&quot;,&quot;nature&quot;:&quot;resource_input&quot;,&quot;grade&quot;:&quot;A&quot;,&quot;sourceId&quot;:&quot;T1-DARPA-003&quot;,&quot;publisher&quot;:&quot;DARPA&quot;,&quot;publishedAt&quot;:&quot;2025-11-14&quot;,&quot;locator&quot;:&quot;web_paragraph_0029&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;,&quot;trust_governance_constraints&quot;],&quot;topics&quot;:[&quot;DARPA Triage Challenge&quot;,&quot;合作伙伴&quot;,&quot;资源投入&quot;],&quot;urlOrPath&quot;:&quot;https://www.darpa.mil/news/2025/dart-msai-triumph-darpa-triage-challenge&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-TECH-H02&quot;,&quot;field&quot;:&quot;judgment&quot;,&quot;relation&quot;:&quot;qualify&quot;,&quot;phase&quot;:&quot;T1字段影响&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H02&quot;,&quot;field&quot;:&quot;mechanism_claims[0]&quot;,&quot;relation&quot;:&quot;qualify&quot;,&quot;phase&quot;:&quot;T1字段影响&quot;}],&quot;disagreementLinks&quot;:[{&quot;id&quot;:&quot;DISAG-T1R-C1-03&quot;,&quot;branch&quot;:&quot;branch_b&quot;}]},{&quot;id&quot;:&quot;CE-T1-C1E0527174B2F72F&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Opportunities for Artificial Intelligence in Operational Medicine: Lessons from the United States Military&quot;,&quot;claim&quot;:&quot;美国陆军未来司令部计划让AI辅助军事医学决策。&quot;,&quot;excerptZh&quot;:&quot;美国陆军未来司令部于2022年制定了一份路线图，计划让AI辅助军事医学决策。&quot;,&quot;excerptOriginal&quot;:&quot;the US Army Futures Command set out a roadmap in 2022 on how it plans to have AI assist with decision-making in military medicine&quot;,&quot;nature&quot;:&quot;goal&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T1-IR-001&quot;,&quot;publisher&quot;:&quot;Bioengineering (MDPI), peer-reviewed research&quot;,&quot;publishedAt&quot;:&quot;2025-05-14&quot;,&quot;locator&quot;:&quot;web_paragraph_0027&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;application_maturity&quot;,&quot;organizational_system_fit&quot;],&quot;topics&quot;:[&quot;军事医学&quot;,&quot;AI决策支持&quot;,&quot;陆军未来司令部&quot;],&quot;urlOrPath&quot;:&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC12108871/&quot;,&quot;changeSignal&quot;:false,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[],&quot;disagreementLinks&quot;:[]},{&quot;id&quot;:&quot;CE-T1-95F7FE29CF48D86D&quot;,&quot;snapshot&quot;:&quot;T1&quot;,&quot;title&quot;:&quot;Opportunities for Artificial Intelligence in Operational Medicine: Lessons from the United States Military&quot;,&quot;claim&quot;:&quot;在作战医疗数据条件下，美国国防部创伤登记处15年数据集仅包含0.017 GB数据。&quot;,&quot;excerptZh&quot;:&quot;美国联合创伤系统国防部创伤登记处（DoDTR）的15年数据集仅包含0.017 GB的数据，尽管包含超过14万份患者记录。&quot;,&quot;excerptOriginal&quot;:&quot;the 15-year dataset in the US Joint Trauma System Department of Defense Trauma Registry (DoDTR) contains only 0.017 Gigabytes of data, despite including over 140,000 patient records&quot;,&quot;nature&quot;:&quot;constraint&quot;,&quot;grade&quot;:&quot;B&quot;,&quot;sourceId&quot;:&quot;T1-IR-001&quot;,&quot;publisher&quot;:&quot;Bioengineering (MDPI), peer-reviewed research&quot;,&quot;publishedAt&quot;:&quot;2025-05-14&quot;,&quot;locator&quot;:&quot;web_paragraph_0049&quot;,&quot;sourceType&quot;:&quot;&quot;,&quot;dimensions&quot;:[&quot;engineering_resource_conditions&quot;],&quot;topics&quot;:[&quot;创伤登记&quot;,&quot;数据规模&quot;,&quot;AI训练限制&quot;],&quot;urlOrPath&quot;:&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC12108871/&quot;,&quot;changeSignal&quot;:true,&quot;humanReviewed&quot;:true,&quot;reviewedBy&quot;:&quot;author_01&quot;,&quot;hypothesisLinks&quot;:[],&quot;viewpointLinks&quot;:[{&quot;id&quot;:&quot;VP-T0-TECH-H03&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot;,&quot;relation&quot;:&quot;boundary_change&quot;,&quot;phase&quot;:&quot;T1字段影响&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H02&quot;,&quot;field&quot;:&quot;boundary_conditions[0]&quot;,&quot;relation&quot;:&quot;qualify&quot;,&quot;phase&quot;:&quot;T1字段影响&quot;},{&quot;id&quot;:&quot;VP-T0-OPS-H02&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;},{&quot;id&quot;:&quot;VP-T0-TECH-H03&quot;,&quot;field&quot;:&quot;current_viewpoint&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;phase&quot;:&quot;当前版本&quot;}],&quot;disagreementLinks&quot;:[{&quot;id&quot;:&quot;DISAG-T1R-C1-02&quot;,&quot;branch&quot;:&quot;branch_a&quot;},{&quot;id&quot;:&quot;DISAG-T1R-C1-03&quot;,&quot;branch&quot;:&quot;branch_b&quot;}]}],&quot;hypotheses&quot;:[{&quot;id&quot;:&quot;HYP-T0-01&quot;,&quot;name&quot;:&quot;体系整合牵引型&quot;,&quot;statement&quot;:&quot;截至2024年底，美国军用人工智能已进入由部门级统一治理、共用能力平台和标准化流程牵引的体系整合过渡期；任务项目仍呈分散状态，但统一能力底座正在成为其主要演进方向。&quot;,&quot;scope&quot;:&quot;美国国防部整体AI发展，时间范围2022-01-01至2024-12-31，涵盖战略、项目、试验和部署事件。&quot;,&quot;assumptions&quot;:[&quot;集中化平台（如JCF）和统一治理（如CDAO）是实现体系化整合的主要标志。&quot;,&quot;从采用到整合的转变是演进的主要方向，而非简单的技术升级。&quot;],&quot;supportingEvidenceIds&quot;:[&quot;EV-T0-5FA6E8C23AC72A82&quot;,&quot;EV-T0-7E37FBD511FC654E&quot;,&quot;EV-T0-27370C837C885AEE&quot;,&quot;EV-T0-0A73030BBF2649F9&quot;,&quot;EV-T0-27EE6FA7DA2FADC0&quot;],&quot;counterEvidenceIds&quot;:[&quot;EV-T0-51D65DEC82584BCD&quot;,&quot;EV-T0-A515E3B9391C51B4&quot;,&quot;EV-T0-8E35B508DF5C2E65&quot;],&quot;conversionCriteria&quot;:[&quot;若跨军种共用AI平台达到实际运行能力，并出现多个项目迁移、复用或共享数据，增强本假设；&quot;,&quot;若统一采办、测试评估和负责任AI流程在多个军种落地，增强本假设；&quot;,&quot;若共用平台持续停留在规划或延迟状态，各项目仍主要独立发展，削弱本假设。&quot;],&quot;unresolvedQuestions&quot;:[&quot;JCF全面作战能力的具体时间表是否在2024年后确定？&quot;,&quot;CDAO在整合各军种AI项目中的实际权限和执行力如何？&quot;],&quot;decision&quot;:&quot;revise_and_accept&quot;,&quot;reviewedBy&quot;:&quot;author_01&quot;},{&quot;id&quot;:&quot;HYP-T0-02&quot;,&quot;name&quot;:&quot;任务分布牵引型&quot;,&quot;statement&quot;:&quot;截至2024年底，美国军用人工智能的实际能力形成仍主要由具体任务需求牵引，通过分散的项目试验、技术演示和局部部署逐步扩展；部门级治理与共用平台尚未实质改变这一主导模式。&quot;,&quot;scope&quot;:&quot;2022-01-01至2024-12-31，美国国防部各组成部门（DARPA、陆军、海军）的AI任务应用与体系集成关系。&quot;,&quot;assumptions&quot;:[&quot;各项目（RACER、REMA、AIDP、IMSC）的独立进展反映了任务驱动的分散发展模式。&quot;,&quot;体系整合的规划文件（如SP-008）尚未转化为实际的跨项目统一部署。&quot;,&quot;联合通用基金会的延迟表明体系化整合面临资源和技术挑战。&quot;],&quot;supportingEvidenceIds&quot;:[&quot;EV-T0-3FA6806CF267B04B&quot;,&quot;EV-T0-9C79EF2837BC80A2&quot;,&quot;EV-T0-9263A423CF1D437F&quot;,&quot;EV-T0-79B653E22A3D4EF4&quot;,&quot;EV-T0-F0773C8E2ECB5C8D&quot;,&quot;EV-T0-C557AE16E4403328&quot;],&quot;counterEvidenceIds&quot;:[&quot;EV-T0-27370C837C885AEE&quot;,&quot;EV-T0-5EA556C2C939C121&quot;,&quot;EV-T0-F8E3070F89D94D25&quot;],&quot;conversionCriteria&quot;:[&quot;若后续进展继续集中于军种或任务专属项目，增强本假设；&quot;,&quot;若DARPA项目主要停留在演示验证而未转入规模化采办，增强本假设；&quot;,&quot;若出现跨军种复用的统一平台、统一模型或统一工程流程，削弱本假设。&quot;],&quot;unresolvedQuestions&quot;:[&quot;各项目之间的技术成果是否存在共享或复用机制？&quot;,&quot;CDAO的协调作用是否已实际影响各军种的AI项目执行？&quot;],&quot;decision&quot;:&quot;revise_and_accept&quot;,&quot;reviewedBy&quot;:&quot;author_01&quot;},{&quot;id&quot;:&quot;HYP-T0-03&quot;,&quot;name&quot;:&quot;约束锁定渐进型&quot;,&quot;statement&quot;:&quot;截至2024年底，美国军用人工智能的战略牵引尚未充分转化为稳定的体系化能力，数据、算力、基础设施、采办和测试评估等约束共同造成能力形成缓慢且应用扩展不均衡。&quot;,&quot;scope&quot;:&quot;2022-01-01至2024-12-31，美国国防部军用AI能力形成与应用扩展，涵盖战略实施、资源条件、工程成熟度、采办测试与部署扩展之间的关系。&quot;,&quot;assumptions&quot;:[&quot;资源约束（如机载处理速度、数据质量、基础设施延迟）是能力形成的主要瓶颈。&quot;,&quot;预算投入（如2023财年11亿美元）和DARPA的数据收集（如100TB传感器数据）尚未完全解决这些瓶颈。&quot;,&quot;战略规划（如SP-008）中的资源投资目标尚未完全实现。&quot;,&quot;国防部层面的AI采办指导方针缺失是体系化发展的主要障碍。&quot;,&quot;各军种自行制定采办指南（如空军）表明缺乏统一协调。&quot;,&quot;负责任AI的灵活方法可能导致标准不一致和执行困难。&quot;],&quot;supportingEvidenceIds&quot;:[&quot;EV-T0-62B1ECDA7DF87F1A&quot;,&quot;EV-T0-AD4CCAC18E1BB26C&quot;,&quot;EV-T0-26CBA9EE14D71B2D&quot;,&quot;EV-T0-850EF492D703EA37&quot;,&quot;EV-T0-51D65DEC82584BCD&quot;,&quot;EV-T0-A515E3B9391C51B4&quot;,&quot;EV-T0-8E35B508DF5C2E65&quot;,&quot;EV-T0-2E42D28FCCBD88DD&quot;,&quot;EV-T0-6FE734DE05953A3C&quot;,&quot;EV-T0-903F4A6639DA3CEC&quot;,&quot;EV-T0-582B12D4B09F11B1&quot;],&quot;counterEvidenceIds&quot;:[&quot;EV-T0-0405886E04C205A6&quot;,&quot;EV-T0-FB39056D1BA1F579&quot;,&quot;EV-T0-425BAC0BC94181E0&quot;,&quot;EV-T0-00FCD33BA877C8BA&quot;,&quot;EV-T0-27EE6FA7DA2FADC0&quot;,&quot;EV-T0-357C993D92C95187&quot;],&quot;conversionCriteria&quot;:[&quot;若数据、边缘算力和共用基础设施瓶颈持续存在，增强本假设；&quot;,&quot;若统一采办和测试评估制度仍未落地，增强本假设；&quot;,&quot;若资源与治理瓶颈得到解决并伴随跨任务规模化部署，削弱本假设。&quot;],&quot;unresolvedQuestions&quot;:[&quot;国防部在算力基础设施（如云、边缘计算）上的实际投资是否足以支撑大规模AI部署？&quot;,&quot;数据质量问题的具体影响程度是否因军种或任务领域而异？&quot;,&quot;CDAO在2023-2024年间是否发布了新的战略或政策文件，证据中未提及。&quot;,&quot;Tradewind市场的实际采购规模和效果缺乏量化数据。&quot;,&quot;各军种AI项目之间的协调机制和冲突解决方式不明确。&quot;],&quot;decision&quot;:&quot;merge_and_accept&quot;,&quot;reviewedBy&quot;:&quot;author_01&quot;}],&quot;viewpoints&quot;:[{&quot;id&quot;:&quot;VP-T0-ENG-H01&quot;,&quot;version&quot;:2,&quot;ref&quot;:&quot;VP-T0-ENG-H01:2&quot;,&quot;snapshotId&quot;:&quot;SNAP-T0-US-MILITARY-AI-C6C812108AF95309&quot;,&quot;status&quot;:&quot;admitted&quot;,&quot;perspective&quot;:&quot;ENG&quot;,&quot;hypothesisId&quot;:&quot;HYP-T0-01&quot;,&quot;judgment&quot;:&quot;从工程与资源视角看，体系整合的牵引方向确实存在，但尚未形成可验证的工程底座。JCF作为核心共用平台，其初始作战能力虽已实现，但全面作战能力因预算和合同问题被推迟且无明确时间表，路线图也未最终确定，这表明统一能力底座在工程层面仍处于未完成状态。CDAO的设立和SP-008战略文件提供了治理和规划框架，但这些是目标而非已实现的工程能力。因此，该假设仅在‘方向正确但工程实现滞后’的条件下成立，且该判断仅针对集中化平台和统一治理机制，不适用于军种特定项目。&quot;,&quot;stance&quot;:&quot;conditional&quot;,&quot;confidence&quot;:&quot;medium&quot;,&quot;supportingEvidence&quot;:[{&quot;evidence_id&quot;:&quot;EV-T0-7E37FBD511FC654E&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-0A73030BBF2649F9&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-27370C837C885AEE&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1}],&quot;counterEvidence&quot;:[{&quot;evidence_id&quot;:&quot;EV-T0-51D65DEC82584BCD&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-A515E3B9391C51B4&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1}],&quot;mechanismClaims&quot;:[&quot;JCF作为共用平台，其工程实现进度直接决定集中化体系整合的物理基础是否具备。&quot;,&quot;CDAO的设立和SP-008战略为整合提供了治理和规划牵引，但缺乏工程落地支撑。&quot;],&quot;keyAssumptions&quot;:[&quot;JCF的全面作战能力是集中化平台整合的工程前提，其延迟意味着该平台整合尚未完成。&quot;,&quot;CDAO的治理授权和SP-008战略文件代表了整合方向，但不等同于已实现的工程能力。&quot;,&quot;JCF和CDAO的状态不代表所有军种特定项目（如AIDP）的工程状态。&quot;],&quot;boundaryConditions&quot;:[&quot;该判断仅适用于JCF等集中化平台和CDAO等统一治理机制，不适用于AIDP等军种特定项目；本判断不推断整个国防部体系整合的工程状态。&quot;,&quot;若JCF在2024年底前达到全面作战能力并实现跨军种数据共享，则本判断需修正。&quot;],&quot;uncertainties&quot;:[&quot;JCF全面作战能力的实际进度和具体功能范围不明确。&quot;,&quot;CDAO的治理授权在工程层面的实际执行力度未知。&quot;,&quot;JCF和CDAO的状态对军种特定项目的影响程度未知。&quot;],&quot;informationGaps&quot;:[&quot;缺乏JCF全面作战能力的具体时间表和里程碑信息。&quot;,&quot;缺乏CDAO在推动共用平台工程落地方面的具体措施和成效数据。&quot;,&quot;缺乏JCF/CDAO状态与军种特定项目工程状态之间关联的证据。&quot;],&quot;falsifiers&quot;:[&quot;若在2024年底前，JCF达到全面作战能力并实现跨军种数据共享，则集中化体系整合的工程基础已形成。&quot;],&quot;parentVersion&quot;:1,&quot;humanVerified&quot;:false,&quot;updateDecision&quot;:&quot;retain&quot;,&quot;updateDecisionReason&quot;:&quot;no P14 evidence-to-field edge&quot;,&quot;newEvidenceCount&quot;:0,&quot;updateRationale&quot;:&quot;&quot;,&quot;changedFields&quot;:[],&quot;newEvidenceIds&quot;:[],&quot;beforeJudgment&quot;:&quot;&quot;,&quot;beforeVersion&quot;:null,&quot;versionHistory&quot;:[{&quot;version&quot;:1,&quot;phase&quot;:&quot;T0&quot;,&quot;stage&quot;:&quot;P7 初始观点&quot;,&quot;judgment&quot;:&quot;从工程与资源视角看，体系整合的牵引方向确实存在，但尚未形成可验证的工程底座。JCF作为核心共用平台，其初始作战能力虽已实现，但全面作战能力因预算和合同问题被推迟且无明确时间表，路线图也未最终确定，这表明统一能力底座在工程层面仍处于未完成状态。CDAO的设立和SP-008战略文件提供了治理和规划框架，但这些是目标而非已实现的工程能力。因此，该假设仅在‘方向正确但工程实现滞后’的条件下成立。&quot;,&quot;stance&quot;:&quot;conditional&quot;,&quot;confidence&quot;:&quot;medium&quot;,&quot;evidenceIds&quot;:[&quot;EV-T0-7E37FBD511FC654E&quot;,&quot;EV-T0-0A73030BBF2649F9&quot;,&quot;EV-T0-27370C837C885AEE&quot;,&quot;EV-T0-51D65DEC82584BCD&quot;,&quot;EV-T0-A515E3B9391C51B4&quot;]},{&quot;version&quot;:2,&quot;phase&quot;:&quot;T0&quot;,&quot;stage&quot;:&quot;P8 质疑响应后／T0冻结版&quot;,&quot;judgment&quot;:&quot;从工程与资源视角看，体系整合的牵引方向确实存在，但尚未形成可验证的工程底座。JCF作为核心共用平台，其初始作战能力虽已实现，但全面作战能力因预算和合同问题被推迟且无明确时间表，路线图也未最终确定，这表明统一能力底座在工程层面仍处于未完成状态。CDAO的设立和SP-008战略文件提供了治理和规划框架，但这些是目标而非已实现的工程能力。因此，该假设仅在‘方向正确但工程实现滞后’的条件下成立，且该判断仅针对集中化平台和统一治理机制，不适用于军种特定项目。&quot;,&quot;stance&quot;:&quot;conditional&quot;,&quot;confidence&quot;:&quot;medium&quot;,&quot;evidenceIds&quot;:[&quot;EV-T0-7E37FBD511FC654E&quot;,&quot;EV-T0-0A73030BBF2649F9&quot;,&quot;EV-T0-27370C837C885AEE&quot;,&quot;EV-T0-51D65DEC82584BCD&quot;,&quot;EV-T0-A515E3B9391C51B4&quot;]}]},{&quot;id&quot;:&quot;VP-T0-ENG-H02&quot;,&quot;version&quot;:2,&quot;ref&quot;:&quot;VP-T0-ENG-H02:2&quot;,&quot;snapshotId&quot;:&quot;SNAP-T0-US-MILITARY-AI-C6C812108AF95309&quot;,&quot;status&quot;:&quot;admitted&quot;,&quot;perspective&quot;:&quot;ENG&quot;,&quot;hypothesisId&quot;:&quot;HYP-T0-02&quot;,&quot;judgment&quot;:&quot;从工程与资源视角看，分散的任务驱动模式是当前能力形成的主导路径。RACER、REMA、AIDP和IMSC等项目均以特定任务需求为牵引，各自独立推进，且DARPA项目（如RACER、REMA）的目标声明显示其仍处于研发阶段，但缺乏直接证据表明其已进入规模化采办。JCF的延迟和SP-008的规划性质进一步表明，共用平台和统一流程尚未在工程层面改变这一模式。因此，该假设与工程现状基本吻合，但需注意DARPA项目状态推断的局限性。&quot;,&quot;stance&quot;:&quot;support&quot;,&quot;confidence&quot;:&quot;medium&quot;,&quot;supportingEvidence&quot;:[{&quot;evidence_id&quot;:&quot;EV-T0-3FA6806CF267B04B&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-9C79EF2837BC80A2&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-A8459E6E8776A15D&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1}],&quot;counterEvidence&quot;:[{&quot;evidence_id&quot;:&quot;EV-T0-27370C837C885AEE&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-5EA556C2C939C121&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1}],&quot;mechanismClaims&quot;:[&quot;任务需求直接驱动项目立项和资源配置，形成分散的工程发展路径。&quot;,&quot;共用平台（JCF）的工程延迟和战略文件的规划性质，未能改变任务驱动的现状。&quot;],&quot;keyAssumptions&quot;:[&quot;DARPA项目（如RACER、REMA）的目标声明表明其仍处于研发阶段，但缺乏直接证据证明其采办状态；该假设基于目标声明推断，存在被后续证据推翻的风险。&quot;,&quot;AIDP的部署是军种特定用例，不代表跨军种通用能力。&quot;,&quot;JCF的延迟表明共用平台在工程层面未形成实际牵引力。&quot;],&quot;boundaryConditions&quot;:[&quot;该判断适用于DARPA项目（RACER、REMA）和军种特定项目（AIDP、IMSC），不适用于已实现跨军种复用的平台。&quot;,&quot;若出现跨军种复用的统一平台或统一工程流程，则本判断需修正。&quot;],&quot;uncertainties&quot;:[&quot;DARPA项目（如RACER）向军种过渡的实际进度不明确。&quot;,&quot;AIDP的部署是否代表陆军AI能力的普遍水平未知。&quot;,&quot;DARPA项目目标声明与实际采办状态之间可能存在差距。&quot;],&quot;informationGaps&quot;:[&quot;缺乏RACER、REMA等项目进入正式采办流程的直接证据。&quot;,&quot;缺乏AIDP在陆军其他任务领域的应用数据。&quot;,&quot;缺乏DARPA项目当前阶段（如演示验证、采办、列装）的官方状态报告。&quot;],&quot;falsifiers&quot;:[&quot;若在2024年底前出现多个军种在作战演习中常态化使用同一套AI系统，且不依赖DARPA专门项目支持，则本假设不成立。&quot;],&quot;parentVersion&quot;:1,&quot;humanVerified&quot;:false,&quot;updateDecision&quot;:&quot;retain&quot;,&quot;updateDecisionReason&quot;:&quot;no P14 evidence-to-field edge&quot;, uot;admitted&quot;,&quot;perspective&quot;:&quot;STRAT&quot;,&quot;hypothesisId&quot;:&quot;HYP-T0-03&quot;,&quot;judgment&quot;:&quot;从战略与组织治理视角看，截至2024年底，美国国防部的战略牵引（如SP-008、RAI战略）已明确，但资源约束（如机载处理速度、数据质量、基础设施延迟）和治理缺口（如缺乏基于经测试标准的组织化方法、缺乏全部门采办指导方针）共同导致能力形成缓慢且应用扩展不均衡。SP-008识别了缺乏组织化方法导致的数据质量挑战，但未明确设定资源投资目标。战略目标与实施能力之间存在显著落差。&quot;,&quot;stance&quot;:&quot;conditional&quot;,&quot;confidence&quot;:&quot;medium&quot;,&quot;supportingEvidence&quot;:[{&quot;evidence_id&quot;:&quot;EV-T0-62B1ECDA7DF87F1A&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-AD4CCAC18E1BB26C&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-8E35B508DF5C2E65&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1}],&quot;counterEvidence&quot;:[{&quot;evidence_id&quot;:&quot;EV-T0-0405886E04C205A6&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-FB39056D1BA1F579&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1}],&quot;mechanismClaims&quot;:[&quot;战略规划（如SP-008）识别了治理方法缺口（如缺乏基于经测试标准的组织化方法导致数据质量挑战），但资源约束和治理缺口（如缺乏统一采办指导）导致战略目标无法有效转化为体系化能力。&quot;],&quot;keyAssumptions&quot;:[&quot;资源约束（如机载处理速度、数据质量、基础设施延迟）是能力形成的主要瓶颈。&quot;,&quot;预算投入（如2023财年11亿美元）和DARPA的数据收集（如100TB传感器数据）尚未完全解决这些瓶颈。&quot;,&quot;国防部层面的AI采办指导方针缺失是体系化发展的主要障碍。&quot;,&quot;SP-008识别了缺乏基于经测试标准的组织化方法导致的数据质量挑战，但未明确设定资源投资目标。&quot;],&quot;boundaryConditions&quot;:[&quot;该判断适用于2022-2024年间的战略实施与资源投入阶段，仅评估战略规划所识别的问题与实施能力之间的落差，不评估具体项目的技术成果，也不将SP-008的内容扩展为包含资源投资目标。&quot;],&quot;uncertainties&quot;:[&quot;预算投入和资源瓶颈之间的因果关系尚不明确。&quot;,&quot;SP-008中关于组织化方法缺口的描述是否代表国防部整体治理缺口的全貌，尚不明确。&quot;],&quot;informationGaps&quot;:[&quot;缺乏关于数据质量、算力基础设施和采办指导方针在2023-2024年间具体改进情况的数据。&quot;,&quot;缺乏SP-008中关于组织化方法缺口的描述与实际治理措施之间对应关系的 15R模型复评引用；字段级依据见evidence_field_changes。&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;CE-T1-C20674F2CA89D5C5&quot;,&quot;note&quot;:&quot;P15R模型复评引用；字段级依据见evidence_field_changes。&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;CE-T1-43B8C6F6E7B77F40&quot;,&quot;note&quot;:&quot;P15R模型复评引用；字段级依据见evidence_field_changes。&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1}],&quot;mechanismClaims&quot;:[&quot;DARPA分诊挑战赛作为竞赛活动，展示了机器人平台在特定场景下的能力，但属于测试事件，不构成规模化采办或部署（证据：CE-T1-F2BE64F4810C89EF, CE-T1-C20674F2CA89D5C5, CE-T1-43B8C6F6E7B77F40）。&quot;,&quot;基于上述项目各自独立进展的公开记录，推断缺乏跨项目复用的统一技术平台或模型——此为观察性推断，受限于公开证据的可得性（推断）。&quot;],&quot;keyAssumptions&quot;:[&quot;各项目的独立进展反映了任务驱动的分散发展模式。&quot;,&quot;SP-008等规划文件尚未转化为实际的跨项目统一部署。&quot;,&quot;现有公开证据未显示跨项目复用机制，但无法排除未公开的共享安排。&quot;,&quot;DARPA分诊挑战赛的竞赛结果仅代表特定测试环境下的表现，不代表作战环境下的成熟度。&quot;],&quot;boundaryConditions&quot;:[&quot;若出现跨军种复用的统一平台、统一模型或统一工程流程，则本假设被削弱。&quot;,&quot;若DARPA项目主要停留在演示验证或竞赛测试而未转入规模化采办，则本假设增强。&quot;,&quot;截至2026年6月30日，T1证据中的DARPA分诊挑战赛属于竞赛测试活动，未显示向全军部署转化。&quot;],&quot;uncertainties&quot;:[&quot;DARPA分诊挑战赛的后续转化路径（如是否进入采办）不明确。&quot;,&quot;各项目之间是否存在未公开的技术复用或数据共享机制，无法从现有证据确认。&quot;,&quot;ACE、RACER等项目的技术成果是否已进入正式的采办或列装流程尚不明确。&quot;,&quot;AIDP的部署是否代表了陆军AI能力的普遍水平，还是仅限情报领域，存在不确定性。&quot;],&quot;informationGaps&quot;:[&quot;缺乏关于各项目之间技术复用或数据共享的具体证据。&quot;,&quot;SP-008中提到的集中平台是否已进入实际开发阶段，缺乏公开信息。&quot;,&quot;国防部或各军种是否在内部建立了跨项目共享的技术标准或组件库，未在公开证据中体现。&quot;,&quot;DARPA分诊挑战赛的竞赛成果是否被军方采纳或进入后续开发，缺乏公开信息。&quot;],&quot;falsifiers&quot;:[&quot;若在2026年7月1日以后出现多个军种在作战演习中常态化使用同一套AI系统，且不依赖DARPA等专门项目支持，则本假设不成立。&quot;,&quot;若在2026年7月1日以后出现DARPA分诊挑战赛成果直接转化为全军采办项目并形成统一工程流程的A/B级证据，则需重新评估。&quot;],&quot;parentVersion&quot;:3,&quot;humanVerified&quot;:false,&quot;updateDecision&quot;:&quot;update&quot;,&quot;updateDecisionReason&quot;:&quot;P14 field-level impact edge exists&quot;,&quot;newEvidenceCount&quot;:5,&quot;updateRationale&quot;:& &quot;:&quot;admitted&quot;,&quot;perspective&quot;:&quot;TRUST&quot;,&quot;hypothesisId&quot;:&quot;HYP-T0-02&quot;,&quot;judgment&quot;:&quot;从可信治理视角看，2022-2024年间的公开证据显示，各AI项目（RACER、REMA、AIDP、IMSC）的进展均表现为任务驱动的独立试验和局部部署，DARPA项目多停留在演示验证阶段，未进入规模化采办。这一项目层面的分散模式与证据高度吻合。然而，必须承认现有支持证据主要反映项目目标和部署事件，缺乏关于治理机制、问责框架或采办流程有效性的直接证据，因此无法从项目层面证据直接推断&#x27;部门级治理尚未实质改变分散模式&#x27;这一治理层面的结论。更准确的表述是：现有证据不足以证明部门级治理已产生实质性的跨项目整合效果。&quot;,&quot;stance&quot;:&quot;support&quot;,&quot;confidence&quot;:&quot;medium&quot;,&quot;supportingEvidence&quot;:[{&quot;evidence_id&quot;:&quot;EV-T0-3FA6806CF267B04B&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-9C79EF2837BC80A2&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-A8459E6E8776A15D&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-F0773C8E2ECB5C8D&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;support&quot;,&quot;version&quot;:1}],&quot;counterEvidence&quot;:[{&quot;evidence_id&quot;:&quot;EV-T0-27370C837C885AEE&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-5EA556C2C939C121&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1},{&quot;evidence_id&quot;:&quot;EV-T0-F8E3070F89D94D25&quot;,&quot;note&quot;:&quot;&quot;,&quot;relation&quot;:&quot;limit&quot;,&quot;version&quot;:1}],&quot;mechanismClaims&quot;:[&quot;RACER和REMA等DARPA项目以技术演示和试验验证为主，尚未进入规模化采办，体现了任务驱动的分散发展。&quot;,&quot;AIDP的快速部署是情报领域特定用例的成功，不代表所有军种或任务领域均达到同等水平。&quot;,&quot;现有证据不足以确认部门级治理机制（如CDAO协调、JCF整合）已对项目层面的分散模式产生实质性的改变效果。&quot;],&quot;keyAssumptions&quot;:[&quot;各项目的独立进展反映了任务驱动的分散发展模式。&quot;,&quot;体系整合的规划文件尚未转化为实际的跨项目统一部署。&quot;,&quot;联合通用基金会的延迟表明体系化整合面临资源和技术挑战。&quot;,&quot;项
