;VP-T0-OPS-H02:4&quot;,&quot;VP-T0-STRAT-H02:3&quot;,&quot;VP-T0-TECH-H02:4&quot;],&quot;author_authorization_sha256&quot;:&quot;0168641acc42d8df525b4e1e3082b460464425603520bc0ebc70c7c3f618859a&quot;,&quot;condition&quot;:&quot;新增材料仍仅为单点演示或自报&quot;,&quot;human_approval_required&quot;:true,&quot;human_verified&quot;:true,&quot;indicator_id&quot;:&quot;IND-T1R-C1-04&quot;,&quot;predicate&quot;:{&quot;condition&quot;:&quot;新增材料仍仅为单点演示或自报&quot;,&quot;strengthens_branch&quot;:&quot;维持范围限制&quot;,&quot;weakens_branch&quot;:&quot;削弱任务扩展&quot;},&quot;predicate_type&quot;:&quot;status_change&quot;,&quot;required_source_grade&quot;:[&quot;A&quot;,&quot;B&quot;],&quot;review_mode&quot;:&quot;ai_pre_review_and_reassessment_plus_author_bulk_signoff_with_key_disagreement_adjudication&quot;,&quot;reviewed_at&quot;:&quot;2026-08-27T11:24:44.914099+00:00&quot;,&quot;reviewed_by&quot;:&quot;author_01&quot;,&quot;run_id&quot;:&quot;FORMAL-G3-T1-G4-T1-FINAL-PAPER-CASE-20260827T112444Z-v1&quot;,&quot;status&quot;:&quot;approved&quot;,&quot;strengthens_branch&quot;:&quot;维持范围限制&quot;,&quot;trigger_id&quot;:&quot;TRG-T1R-C1-08&quot;,&quot;weakens_branch&quot;:&quot;削弱任务扩展&quot;}],&quot;audit&quot;:{&quot;invalidEvidenceReferences&quot;:0,&quot;excludedEvidenceReferences&quot;:0,&quot;historicalChangeSignalReferences&quot;:0,&quot;semanticNatureMismatches&quot;:0,&quot;humanSourceVisualReviewCount&quot;:0,&quot;modelApiCallsAtFinalSigning&quot;:0,&quot;formalEvidenceInsertedAtFinalSigning&quot;:0,&quot;formalViewpointsInsertedAtFinalSigning&quot;:0,&quot;syntheticRunsExcluded&quot;:true,&quot;note&quot;:&quot;phase-a-demo与synthetic_military_ai仅用于流程测试，未混入正式案例证据与结论。&quot;}}&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;military-ai-case-trace&#x27;);
      const data = JSON.parse(root.querySelector(&#x27;#case-data&#x27;).textContent);
      const esc = value =&gt; String(value ?? &#x27;&#x27;).replace(/[&amp;&lt;&gt;&#x27;&quot;]/g, ch =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;}[ch]));
      const listHtml = items =&gt; items &amp;&amp; items.length ? `&lt;ul&gt;${items.map(x =&gt; `&lt;li&gt;${esc(typeof x === &#x27;string&#x27; ? x : JSON.stringify(x))}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;` : &#x27;&lt;span class=&quot;text-muted&quot;&gt;无&lt;/span&gt;&#x27;;
      const badge = text =&gt; `&lt;span class=&quot;viz-badge&quot;&gt;${esc(text)}&lt;/span&gt;`;
      const shortVp = id =&gt; id.replace(&#x27;VP-T0-&#x27;, &#x27;&#x27;);
      const hypName = id =&gt; (data.hypotheses.find(h =&gt; h.id === id) || {}).name || id;
      const perspectiveNames = {STRAT:&#x27;战略治理&#x27;, TECH:&#x27;技术能力&#x27;, ENG:&#x27;工程资源&#x27;, OPS:&#x27;任务应用&#x27;, TRUST:&#x27;可信治理&#x27;};
      const natureNames = {goal:&#x27;目标&#x27;,governance_event:&#x27;治理事件&#x27;,resource_input:&#x27;资源投入&#x27;,test_event:&#x27;测试活动&#x27;,test_result:&#x27;测试结果&#x27;,deployment_event:&#x27;部署事件&#x27;,constraint:&#x27;约束&#x27;,evaluation:&#x27;评价&#x27;};
      const relationNames = {support:&#x27;支持&#x27;,limit:&#x27;限制&#x27;,qualify:&#x27;限定&#x27;,boundary_change:&#x27;边界变化&#x27;};

      root.querySelector(&#x27;#case-kicker&#x27;).textContent = `${data.meta.t0Window} → ${data.meta.t1Window}`;
      root.querySelector(&#x27;#case-meta&#x27;).innerHTML = `${badge(data.meta.reviewMode)} ${badge(&#x27;最终状态：正式签发&#x27;)} ${badge(data.meta.formalRunId)}`;

      const tabs = [...root.querySelectorAll(&#x27;[data-tab]&#x27;)];
      tabs.forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; {
        tabs.forEach(b =&gt; b.setAttribute(&#x27;aria-selected&#x27;, String(b === btn)));
        root.querySelectorAll(&#x27;.case-panel&#x27;).forEach(panel =&gt; { panel.hidden = panel.id !== `panel-${btn.dataset.tab}`; });
      }));

      root.querySelector(&#x27;#overview-stats&#x27;).innerHTML = [
        [&#x27;证据快照&#x27;, `${data.metrics.t0Evidence} → ${data.metrics.t1CumulativeEvidence}`, `T1新增${data.metrics.t1NewEvidence}条；${data.metrics.t1ChangeSignals}条变化信号`],
        [&#x27;观点版本&#x27;, `${data.metrics.updatedViewpoints} 更新 / ${data.metrics.retainedViewpoints} 保持`, &#x27;15条观点只做局部追加&#x27;],
        [&#x27;分歧治理&#x27;, `${data.metrics.disagreements}项分歧`, `${data.metrics.needs}项需求 · ${data.metrics.indicators}项指标 · ${data.metrics.triggers}条触发规则`]
      ].map(x =&gt; `&lt;div class=&quot;card viz-stat&quot;&gt;&lt;div class=&quot;text-muted&quot;&gt;${x[0]}&lt;/div&gt;&lt;div class=&quot;viz-stat-value tabular-nums&quot;&gt;${x[1]}&lt;/div&gt;&lt;div&gt;${x[2]}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      root.querySelector(&#x27;#t0-conclusion&#x27;).textContent = data.conclusions.t0;
      root.querySelector(&#x27;#t1-conclusion&#x27;).textContent = data.conclusions.t1;
      root.querySelector(&#x27;#revision-card&#x27;).innerHTML = `&lt;h3&gt;变化性质&lt;/h3&gt;&lt;div&gt;${esc(data.conclusions.revision)}&lt;/div&gt;&lt;div class=&quot;detail-grid&quot;&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;体系整合增强条件&lt;/strong&gt;&lt;div&gt;${esc(data.conclusions.strengthenIntegrationIf)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;任务分布与约束解释继续保留&lt;/strong&gt;&lt;div&gt;${esc(data.conclusions.retainDistributedIf)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
      root.querySelector(&#x27;#hypothesis-summary&#x27;).innerHTML = data.hypotheses.map(h =&gt; `&lt;div&gt;&lt;h3&gt;${esc(h.name)}&lt;/h3&gt;&lt;div&gt;${esc(h.statement)}&lt;/div&gt;&lt;details&gt;&lt;summary&gt;假设与转换条件&lt;/summary&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;关键假设&lt;/strong&gt;${listHtml(h.assumptions)}&lt;/div&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;转换条件&lt;/strong&gt;${listHtml(h.conversionCriteria)}&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;`).join(&#x27;&#x27;);

      function renderBars(target, values) {
        const max = Math.max(...Object.values(values));
        root.querySelector(target).innerHTML = Object.entries(values).sort((a,b) =&gt; b[1]-a[1]).map(([name,value]) =&gt; `&lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;${esc(name)}&lt;/span&gt;&lt;div class=&quot;bar-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;bar-fill&quot; style=&quot;width:${(value/max)*100}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;tabular-nums text-end&quot;&gt;${value}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      }
      renderBars(&#x27;#nature-bars&#x27;, Object.fromEntries(Object.entries(data.metrics.natures).map(([k,v]) =&gt; [natureNames[k] || k,v])));
      renderBars(&#x27;#grade-bars&#x27;, data.metrics.grades);

      root.querySelector(&#x27;#process-list&#x27;).innerHTML = data.process.map(step =&gt; `&lt;div class=&quot;phase-item&quot; data-status=&quot;${esc(step.status)}&quot;&gt;&lt;div&gt;&lt;div class=&quot;phase-label&quot;&gt;${esc(step.phase)}&lt;/div&gt;${badge(step.status)}&lt;/div&gt;&lt;div&gt;&lt;h3&gt;${esc(step.title)}&lt;/h3&gt;&lt;div&gt;${esc(step.what)}&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;人工门：${esc(step.gate)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;phase-artifact text-small&quot;&gt;${esc(step.artifact)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);

      const natureSelect = root.querySelector(&#x27;#evidence-nature&#x27;);
      Object.keys(data.metrics.natures).forEach(n =&gt; natureSelect.insertAdjacentHTML(&#x27;beforeend&#x27;, `&lt;option value=&quot;${esc(n)}&quot;&gt;${esc(natureNames[n] || n)}&lt;/option&gt;`));
      let evidencePage = 0;
      const evidencePageSize = 12;
      let selectedEvidenceId = data.evidence[0].id;
      function filteredEvidence() {
        const q = root.querySelector(&#x27;#evidence-search&#x27;).value.trim().toLowerCase();
        const snap = root.querySelector(&#x27;#evidence-snapshot&#x27;).value;
        const grade = root.querySelector(&#x27;#evidence-grade&#x27;).value;
        const nature = root.querySelector(&#x27;#evidence-nature&#x27;).value;
        return data.evidence.filter(e =&gt; (!snap || e.snapshot === snap) &amp;&amp; (!grade || e.grade === grade) &amp;&amp; (!nature || e.nature === nature) &amp;&amp; (!q || [e.id,e.title,e.claim,e.publisher,e.sourceId,...e.topics].join(&#x27; &#x27;).toLowerCase().includes(q)));
      }
      function renderEvidenceDetail(id) {
        const e = data.evidence.find(x =&gt; x.id === id);
        if (!e) return;
        selectedEvidenceId = id;
        root.querySelector(&#x27;#evidence-detail&#x27;).innerHTML = `&lt;div class=&quot;inline-meta&quot;&gt;&lt;h3&gt;${esc(e.id)}&lt;/h3&gt;${badge(e.snapshot)}${badge(`等级${e.grade}`)}${badge(natureNames[e.nature] || e.nature)}${e.changeSignal ? badge(&#x27;T1变化信号&#x27;) : &#x27;&#x27;}&lt;/div&gt;&lt;div&gt;${esc(e.claim)}&lt;/div&gt;&lt;details&gt;&lt;summary&gt;原始摘录与来源&lt;/summary&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;中文摘录&lt;/strong&gt;&lt;div&gt;${esc(e.excerptZh || e.claim)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;原文&lt;/strong&gt;&lt;div&gt;${esc(e.excerptOriginal)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;来源&lt;/strong&gt;&lt;div&gt;${esc(e.title)} · ${esc(e.publisher)} · ${esc(e.publishedAt)} · ${esc(e.sourceId)} · ${esc(e.locator)}&lt;/div&gt;&lt;div class=&quot;mini-code text-small&quot;&gt;${esc(e.urlOrPath)}&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;detail-grid&quot;&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;连接到假设&lt;/strong&gt;${listHtml(e.hypothesisLinks.map(x =&gt; `${x.id} · ${relationNames[x.relation] || x.relation}`))}&lt;/div&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;连接到观点字段&lt;/strong&gt;${listHtml(e.viewpointLinks.map(x =&gt; `${shortVp(x.id)} · ${x.field} · ${relationNames[x.relation] || x.relation} · ${x.phase}`))}&lt;/div&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;连接到分歧&lt;/strong&gt;${listHtml(e.disagreementLinks.map(x =&gt; `${x.id} · ${x.branch}`))}&lt;/div&gt;&lt;div class=&quot;detail-block&quot;&gt;&lt;strong&gt;编码维度&lt;/strong&gt;${listHtml(e.dimensions)}&lt;/div&gt;&lt;/div&gt;`;
      }
      function renderEvidence() {
        const rows = filteredEvidence();
        const maxPage = Math.max(0, Math.ceil(rows.length/evidencePageSize)-1);
        evidencePage = Math.min(evidencePage, maxPage);
        const pageRows = rows.slice(evidencePage*evidencePageSize, (evidencePage+1)*evidencePageSize);
        root.querySelector(&#x27;#evidence-count&#x27;).textContent = `${rows.length}条结果 · 第${evidencePage+1}/${maxPage+1}页`;
        root.querySelector(&#x27;#evidence-prev&#x27;).disabled = evidencePage === 0;
        root.querySelector(&#x27;#evidence-next&#x27;).disabled = evidencePage === maxPage;
        root.querySelector(&#x27;#evidence-body&#x27;).innerHTML = pageRows.map(e =&gt; `&lt;tr&gt;&lt;td class=&quot;id-cell&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-evidence-id=&quot;${esc(e.id)}&quot;&gt;${esc(e.id)}&lt;/button&gt;&lt;/td&gt;&lt;td&gt;${esc(e.snapshot)} / ${esc(e.grade)}&lt;/td&gt;&lt;td&gt;${esc(natureNames[e.nature] || e.nature)}${e.changeSignal ? &#x27;&lt;br&gt;&lt;span class=&quot;text-small&quot;&gt;变化信号&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/td&gt;&lt;td class=&quot;claim-cell&quot;&gt;${esc(e.claim)}&lt;/td&gt;&lt;td class=&quot;text-center tabular-nums&quot;&gt;${e.hypothesisLinks.length + e.viewpointLinks.length + e.disagreementLinks.length}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) || &#x27;&lt;tr&gt;&lt;td colspan=&quot;5&quot;&gt;无匹配证据&lt;/td&gt;&lt;/tr&gt;&#x27;;
        root.querySelectorAll(&#x27;[data-evidence-id]&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; renderEvidenceDetail(btn.dataset.evidenceId)));
        if (!rows.some(e =&gt; e.id === selectedEvidenceId) &amp;&amp; rows[0]) renderEvidenceDetail(rows[0].id);
      }
      [&#x27;#evidence-search&#x27;,&#x27;#evidence-snapshot&#x27;,&#x27;#evidence-grade&#x27;,&#x27;#evidence-nature&#x27;].forEach(sel =&gt; root.querySelector(sel).addEventListener(&#x27;input&#x27;, () =&gt; { evidencePage=0; renderEvidence(); }));
      root.querySelector(&#x27;#evidence-prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { evidencePage--; renderEvidence(); });
      root.querySelector(&#x27;#evidence-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { evidencePage++; renderEvidence(); });
      renderEvidence(); renderEvidenceDetail(selectedEvidenceId);

      const matrix = root.querySelector(&#x27;#viewpoint-matrix&#x27;);
      matrix.innerHTML = `&lt;div&gt;&lt;/div&gt;${data.hypotheses.map(h =&gt; `&lt;div class=&quot;matrix-head&quot;&gt;${esc(h.name)}&lt;/div&gt;`).join(&#x27;&#x27;)}`;
      [&#x27;STRAT&#x27;,&#x27;TECH&#x27;,&#x27;ENG&#x27;,&#x27;OPS&#x27;,&#x27;TRUST&#x27;].forEach(p =&gt; {
        matrix.insertAdjacentHTML(&#x27;beforeend&#x27;, `&lt;div class=&quot;matrix-row-label&quot;&gt;${esc(perspectiveNames[p])}&lt;/div&gt;`);
        data.hypotheses.forEach(h =&gt; {
          const vp = data.viewpoints.find(v =&gt; v.perspective === p &amp;&amp; v.hypothesisId === h.id);
          const mark = vp.updateDecision === &#x27;update&#x27; ? &#x27;*&#x27; : &#x27;&#x27;;
          matrix.insertAdjacentHTML(&#x27;beforeend&#x27;, `&lt;button type=&quot;button&quot; class=&quot;btn viz-tile&quot; data-viewpoint-id=&quot;${esc(vp.id)}&quot; aria-label=&quot;${esc(vp.id)}，${vp.updateDecision === &#x27;update&#x27; ? &#x27;T1更新&#x27; : &#x27;保持T0版本&#x27;}&quot;&gt;${esc(shortVp(vp.id))}${mark}&lt;/button&gt;`);
        });
      });
      function renderViewpoint(id) {
        const v = data.viewpoints.find(x =&gt; x.id === id);
        root.querySelectorAll(&#x27;[data-viewpoint-id]&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-pressed&#x27;, String(b.dataset.viewpointId === id)));
        const history = v.versionHistory || [];
        const t0History = history.filter(x =&gt; x.phase === &#x27;T0&#x27;);
        const t1History = history.filter(x =&gt; x.phase === &#x27;T1&#x27;);
        const t0Final = t0History[t0History.length - 1] || {version: v.beforeVersion || v.version, judgment: v.beforeJudgment || v.judgment};
        const t1Final = t1History[t1History.length - 1] || t0Final;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };

    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };
